<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warchest — Dynasty HQ for Sleeper</title>
<meta name="description" content="KTC-style market values, power rankings, and a trade calculator for your Sleeper fantasy leagues. Read-only, no login.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
<style>
/* ---------- theme tokens (light on :root; dark under media + data-theme) ---------- */
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb;
  --ink-1: #0b0b0b; --ink-2: #52514e; --ink-muted: #898781;
  --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --seq-fill: #2a78d6; --seq-track: #cde2fb;
  --up: #006300; --down: #d03b3b;
  --accent: #2a78d6; --accent-soft: rgba(42,120,214,0.12);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --seq-fill: #3987e5; --seq-track: #0d366b;
    --up: #0ca30c; --down: #d03b3b;
    --accent: #3987e5; --accent-soft: rgba(57,135,229,0.16);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19;
  --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-muted: #898781;
  --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --seq-fill: #3987e5; --seq-track: #0d366b;
  --up: #0ca30c; --down: #d03b3b;
  --accent: #3987e5; --accent-soft: rgba(57,135,229,0.16);
}

* { box-sizing: border-box; margin: 0; }
html, body { background: var(--page); color: var(--ink-1);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select { font: inherit; color: var(--ink-1); background: var(--surface);
  border: 1px solid var(--baseline); border-radius: 8px; padding: 7px 10px; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 64px; }

/* ---------- header ---------- */
header { position: sticky; top: 0; z-index: 20; background: var(--page);
  border-bottom: 1px solid var(--grid); }
.head-in { max-width: 1080px; margin: 0 auto; padding: 12px 16px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
.logo svg { display: block; }
.logo .tag { font-weight: 400; font-size: 12px; color: var(--ink-muted); }
.head-spacer { flex: 1; }
.userbox { display: flex; gap: 8px; align-items: center; }
.userbox input { width: 150px; }
.btn { background: var(--accent); color: #fff; border-radius: 8px; padding: 7px 14px; font-weight: 600; }
.btn.ghost { background: none; color: var(--ink-2); border: 1px solid var(--baseline); }
.btn:disabled { opacity: .5; cursor: default; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--grid); }

/* ---------- league picker + controls ---------- */
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 14px 0 4px; }
.chip { border: 1px solid var(--baseline); border-radius: 999px; padding: 5px 12px;
  color: var(--ink-2); font-size: 13px; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink-1); font-weight: 600; }
.pill { font-size: 11px; border: 1px solid var(--baseline); border-radius: 999px;
  padding: 2px 8px; color: var(--ink-muted); }
.pill.warn { border-color: var(--s2); color: var(--s2); }
.seg { display: inline-flex; border: 1px solid var(--baseline); border-radius: 8px; overflow: hidden; }
.seg button { padding: 5px 12px; font-size: 13px; color: var(--ink-2); }
.seg button.on { background: var(--accent-soft); color: var(--ink-1); font-weight: 600; }

/* ---------- tabs ---------- */
nav.tabs { display: flex; gap: 2px; margin: 14px 0 18px; border-bottom: 1px solid var(--grid); }
nav.tabs button { padding: 9px 14px; color: var(--ink-2); font-weight: 600;
  border-bottom: 2px solid transparent; margin-bottom: -1px; }
nav.tabs button.on { color: var(--ink-1); border-bottom-color: var(--accent); }

/* ---------- cards / layout ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; margin-bottom: 16px; }
.card h2 { font-size: 15px; margin-bottom: 2px; }
.card .sub { color: var(--ink-muted); font-size: 12px; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
/* grid items default to min-width:auto and refuse to shrink below their content,
   which pushes a wide table out of the page instead of letting it scroll itself */
.grid2 > * { min-width: 0; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
.statrow { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 16px; min-width: 140px; flex: 1; }
.stat .lab { font-size: 12px; color: var(--ink-muted); }
.stat .val { font-size: 26px; font-weight: 600; margin-top: 2px; }
.stat .sub { font-size: 12px; color: var(--ink-2); }

/* ---------- power ranking bars ---------- */
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; color: var(--ink-2); }
.legend .key { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.prow { display: grid; grid-template-columns: 26px 170px 1fr 74px; gap: 10px;
  align-items: center; padding: 5px 0; }
.prow .rank { color: var(--ink-muted); font-size: 12px; text-align: right; }
.prow .team { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .team .you { font-size: 10px; font-weight: 700; color: var(--accent);
  border: 1px solid var(--accent); border-radius: 999px; padding: 0 6px; margin-left: 6px; }
.prow .val { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-2); text-align: right; }
.bar { display: flex; height: 20px; align-items: stretch; }
.bar .segm { margin-right: 2px; }
.bar .segm:last-child { margin-right: 0; border-radius: 0 4px 4px 0; }
@media (max-width: 700px) { .prow { grid-template-columns: 22px 110px 1fr 64px; } }

/* ---------- tables ---------- */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; color: var(--ink-muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
td { padding: 7px 8px; border-bottom: 1px solid var(--grid); font-size: 13px; }
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.me td { background: var(--accent-soft); }
tr.taken td { opacity: .38; }
.posgroup td.gh { font-size: 11px; font-weight: 700; color: var(--ink-muted);
  text-transform: uppercase; letter-spacing: .05em; padding-top: 14px; border-bottom: 1px solid var(--baseline); }
.meter { display: inline-flex; align-items: center; gap: 8px; width: 100%; }
.meter .track { flex: 1; height: 8px; border-radius: 4px; background: var(--seq-track); overflow: hidden; }
.meter .fill { height: 100%; background: var(--seq-fill); border-radius: 0 4px 4px 0; }
.meter .mval { width: 48px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
.delta-up { color: var(--up); } .delta-down { color: var(--down); }
.posbadge { font-size: 10px; font-weight: 700; border-radius: 4px; padding: 1px 5px;
  color: var(--ink-2); border: 1px solid var(--baseline); }

/* ---------- edge tags ---------- */
.tag { font-size: 10px; font-weight: 700; border-radius: 4px; padding: 1px 6px;
  letter-spacing: .03em; white-space: nowrap; }
.tag.diamond { color: #fff; background: var(--s3); border: 1px solid var(--s3); }
.tag.buy { color: var(--up); border: 1px solid var(--up); }
.tag.rental { color: var(--s4); border: 1px solid var(--s4); }
.tag.sell { color: var(--down); border: 1px solid var(--down); }
.tag.hold { color: var(--ink-muted); border: 1px solid var(--baseline); }
.tag.nosample { color: var(--ink-muted); border: 1px dashed var(--baseline); }
.evidence { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  margin: 10px 0 14px; background: color-mix(in srgb, var(--accent) 4%, transparent); }
.evidence .ev-h { font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; color: var(--ink-muted); margin-bottom: 8px; }
.evidence .ev-row { display: flex; gap: 9px; align-items: flex-start;
  font-size: 12px; color: var(--ink-2); margin-bottom: 5px; line-height: 1.4; }
.evidence .ev-row .tag { flex: 0 0 auto; margin-top: 1px; }
.edge-pos { color: var(--up); font-weight: 600; }
.edge-neg { color: var(--down); font-weight: 600; }

/* ---------- trade calculator ---------- */
.tside { border: 1px solid var(--border); border-radius: 12px; padding: 14px; background: var(--surface); }
.tside h3 { font-size: 13px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.tsearch { position: relative; margin-bottom: 10px; }
.tsearch input { width: 100%; }
.sugg { position: absolute; top: 100%; left: 0; right: 0; z-index: 10; background: var(--surface);
  border: 1px solid var(--baseline); border-radius: 8px; margin-top: 4px; overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.sugg button { display: flex; width: 100%; gap: 8px; align-items: center; padding: 8px 10px;
  text-align: left; font-size: 13px; }
.sugg button:hover, .sugg button.hl { background: var(--accent-soft); }
.sugg .sv { margin-left: auto; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.asset { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px;
  border: 1px solid var(--grid); margin-bottom: 6px; font-size: 13px; }
.asset .av { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.asset .rm { color: var(--ink-muted); font-size: 15px; padding: 0 2px; }
.asset .rm:hover { color: var(--down); }
.tside .total { text-align: right; font-weight: 700; font-size: 15px; margin-top: 8px; }
.sig-chips { display: flex; gap: 5px; flex-wrap: wrap; margin: -3px 0 6px; cursor: default; }
.sig-chips .tag { font-size: 9px; padding: 1px 5px; }
.sig-notes { margin-bottom: 12px; }
.sig-note { font-size: 12px; color: var(--ink-2); line-height: 1.5; margin-bottom: 4px; }
.sig-note b { color: var(--ink-1); }
.trade-idea { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
  margin-bottom: 12px; background: var(--surface); }
.ti-hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.ti-vs { font-weight: 700; font-size: 13px; }
.ti-fair { margin-left: auto; font-size: 12px; color: var(--ink-muted); }
.ti-body { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.ti-side { flex: 1; min-width: 200px; font-size: 13px; }
.ti-side b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--ink-muted); margin-bottom: 2px; }
.ti-val { display: block; font-weight: 700; margin-top: 2px; }
.ti-arrow { font-size: 18px; color: var(--ink-muted); }
.ti-why { font-size: 12px; color: var(--ink-2); line-height: 1.6; }
@media (max-width: 640px) { .ti-body { flex-direction: column; align-items: stretch; }
  .ti-arrow { text-align: center; } }
.verdict { margin-top: 16px; }
.vbar { display: flex; height: 22px; margin: 10px 0 6px; }
.vbar > div { border-radius: 4px; }
.vbar .a { background: var(--s1); margin-right: 2px; border-radius: 4px 0 0 4px; }
.vbar .b { background: var(--s2); border-radius: 0 4px 4px 0; }
.vlabels { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); }
.vmsg { text-align: center; font-weight: 700; font-size: 15px; margin-top: 10px; }
.vmsg .sub { display: block; font-weight: 400; font-size: 12px; color: var(--ink-muted); margin-top: 2px; }

/* ---------- misc ---------- */
.banner { border: 1px solid var(--s2); background: color-mix(in srgb, var(--s2) 8%, var(--surface));
  color: var(--ink-1); border-radius: 10px; padding: 10px 14px; margin: 14px 0; font-size: 13px; }
.banner.err { border-color: var(--down); background: color-mix(in srgb, var(--down) 8%, var(--surface)); }
.status { color: var(--ink-muted); font-size: 13px; margin: 12px 0; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--grid);
  border-top-color: var(--accent); border-radius: 50%; animation: sp 0.8s linear infinite;
  vertical-align: -2px; margin-right: 6px; }
@keyframes sp { to { transform: rotate(360deg); } }
#tooltip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface);
  border: 1px solid var(--baseline); border-radius: 8px; padding: 8px 10px; font-size: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,.22); display: none; max-width: 260px; }
#tooltip .tt-title { font-weight: 700; margin-bottom: 4px; }
#tooltip .tt-row { display: flex; gap: 10px; justify-content: space-between; color: var(--ink-2); }
footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--grid);
  color: var(--ink-muted); font-size: 12px; }
.hidden { display: none !important; }
.empty { color: var(--ink-muted); text-align: center; padding: 32px 0; }

/* ---------- phone ---------- */
@media (max-width: 640px) {
  .wrap { padding: 0 12px 48px; }
  .head-in { padding: 10px 12px; gap: 8px; }
  .logo { font-size: 16px; }
  .logo .tag { display: none; }
  .userbox { width: 100%; order: 3; }
  .userbox input { flex: 1; width: auto; min-width: 0; }
  .head-spacer { display: none; }
  /* tab strip scrolls sideways instead of wrapping into two rows */
  nav.tabs { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    margin: 12px -12px 14px; padding: 0 12px; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { flex: 0 0 auto; padding: 10px 12px; font-size: 13px; }
  .controls { gap: 6px; margin: 12px 0 2px; overflow-x: auto; scrollbar-width: none;
    flex-wrap: nowrap; padding-bottom: 2px; }
  .controls::-webkit-scrollbar { display: none; }
  .controls > * { flex: 0 0 auto; }
  /* two stat tiles per row reads better than four squeezed ones */
  .statrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { min-width: 0; padding: 10px 12px; }
  .stat .val { font-size: 21px; overflow-wrap: anywhere; }
  .card { padding: 13px; border-radius: 11px; }
  .prow { grid-template-columns: 18px 1fr 62px; grid-template-areas: "r t v" ". b b";
    gap: 4px 8px; padding: 7px 0; }
  .prow .rank { grid-area: r; } .prow .team { grid-area: t; }
  .prow .val { grid-area: v; } .prow .bar { grid-area: b; height: 16px; }
  /* wide tables scroll inside themselves; the page body never scrolls sideways */
  table { display: block; overflow-x: auto; width: auto; min-width: 100%;
    -webkit-overflow-scrolling: touch; }
  th, td { padding: 7px 6px; white-space: nowrap; }
  .meter { min-width: 130px; }
  .tside { padding: 12px; }
  /* comfortable thumb targets */
  .sugg button { padding: 11px 10px; }
  .asset { padding: 9px 10px; }
  .asset .rm { padding: 0 6px; font-size: 17px; }
  .btn { padding: 9px 14px; }
  #tooltip { max-width: min(280px, calc(100vw - 24px)); }
}
</style>
</head>
<body>
<header><div class="head-in">
  <span class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M5.5 4h13L22 9.5 12 21 2 9.5 5.5 4Z" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M2 9.5h20M8.5 9.5 12 21l3.5-11.5M8.5 9.5 12 4l3.5 5.5" stroke="var(--accent)" stroke-width="1.3" stroke-linejoin="round"/>
    </svg>
    Warchest <span class="tag">dynasty HQ for Sleeper</span>
  </span>
  <span class="head-spacer"></span>
  <span class="userbox">
    <img id="uavatar" class="avatar hidden" alt="">
    <input id="uname" placeholder="Sleeper username" autocomplete="off" spellcheck="false">
    <button id="loadBtn" class="btn">Load</button>
    <button id="themeBtn" class="btn ghost" title="Toggle theme">◐</button>
  </span>
</div></header>

<div class="wrap">
  <div id="banner"></div>
  <div id="controls" class="controls hidden">
    <span id="leagueChips"></span>
    <span class="head-spacer"></span>
    <span class="seg" id="modeSeg">
      <button data-mode="dynasty" class="on">Dynasty</button>
      <button data-mode="redraft">Redraft</button>
    </span>
    <span id="fmtPill" class="pill"></span>
    <span id="srcPill" class="pill"></span>
  </div>
  <div id="status" class="status"><span class="spin"></span>Loading…</div>

  <nav class="tabs hidden" id="tabs">
    <button data-tab="power" class="on">Power Rankings</button>
    <button data-tab="rosters">Rosters</button>
    <button data-tab="draft">Draft</button>
    <button data-tab="board">Buy / Sell Board</button>
    <button data-tab="tradefinder">Trade Finder</button>
    <button data-tab="trade">Trade Calculator</button>
    <button data-tab="freeagents">Free Agents</button>
    <button data-tab="standings">Standings</button>
    <button data-tab="market">Market</button>
  </nav>

  <main id="view"></main>

  <footer>
    <b>Warchest</b> is read-only: Sleeper's public API has no login and no write access —
    your password is never needed, never asked for. Values courtesy of the free
    <a href="https://www.fantasycalc.com" target="_blank" rel="noopener">FantasyCalc</a> API
    (market-based, KTC-style 0–10k scale); league data from the
    <a href="https://docs.sleeper.com" target="_blank" rel="noopener">Sleeper API</a>.
  </footer>
</div>
<div id="tooltip"></div>

<script>
"use strict";
/* =============================== state =============================== */
const SLEEPER = "https://api.sleeper.app/v1";
const FC = "https://api.fantasycalc.com/values/current";
const CDN = "https://sleepercdn.com";
const POS_SLOTS = { QB:["QB"], RB:["RB"], WR:["WR"], TE:["TE"], K:["K"], DEF:["DEF"],
  FLEX:["RB","WR","TE"], WRRB_FLEX:["WR","RB"], WRRB_WRT_FLEX:["WR","RB","TE"],
  REC_FLEX:["WR","TE"], SUPER_FLEX:["QB","RB","WR","TE"] };
const GROUPS = ["QB","RB","WR","TE"];
const GROUP_VARS = { QB:"--s1", RB:"--s2", WR:"--s3", TE:"--s4" };

const S = {
  username:null, user:null, season:null, seasonType:null, leagues:[], league:null,
  rosters:[], lusers:[], players:{}, values:{}, picks:[],
  stats:{}, prodSeason:null, edges:{}, faPos:"ALL", faSort:"edge",
  sig:{}, sigMeta:null, boardPos:"ALL", boardSide:"buy",
  mode:"dynasty", source:null, myRosterId:null, tab:"power",
  trade:{ a:[], b:[] },
};
/* A player needs this many games before production is treated as signal rather
   than noise — a 2-game hot streak should never rank as a positional WR1. */
const MIN_GP = 6;
const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, html) => { const n=document.createElement(tag);
  if(cls) n.className=cls; if(html!=null) n.innerHTML=html; return n; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n) => Math.round(n).toLocaleString("en-US");

/* =============================== fetch =============================== */
/* Demo mode: when a baked dataset is present the app never touches the network,
   so it runs anywhere outbound requests are sandboxed (e.g. a published
   artifact). Same rendering code either way — only the transport changes. */
const DEMO = window.WARCHEST_DEMO || null;
function demoRoute(url) {
  if (url.startsWith(FC)) return DEMO.values;
  const p = url.slice(SLEEPER.length);
  if (p === "/state/nfl") return DEMO.state;
  if (p === "/players/nfl") return DEMO.players;
  if (p.startsWith("/stats/nfl/")) return DEMO.stats || {};
  if (p.startsWith("/draft/")) return p.endsWith("/picks") ? [] : {};
  if (p.includes("/trending/add")) return DEMO.trendingAdd;
  if (p.includes("/trending/drop")) return DEMO.trendingDrop;
  if (p.includes("/leagues/nfl/")) return p.endsWith(`/${DEMO.season}`) ? DEMO.leagues : [];
  if (p.startsWith("/user/")) return DEMO.user;
  const m = p.match(/^\/league\/([^/]+)\/(\w+)/);
  if (m) return (DEMO.leagueData[m[1]] || {})[m[2]] ?? [];
  return null;
}
async function getJSON(url, timeoutMs=20000, init) {
  if (DEMO) return demoRoute(url);
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const r = await fetch(url, { signal: ctl.signal, ...(init || {}) });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } finally { clearTimeout(t); }
}
const sleeper = (path) => getJSON(SLEEPER + path);

function lsGet(key, ttlMs) {
  if (DEMO) return null;   // never mix baked demo data into the real cache
  try { const raw = localStorage.getItem(key); if (!raw) return null;
    const { t, d } = JSON.parse(raw);
    return (Date.now() - t < ttlMs) ? d : null; } catch { return null; }
}
function lsSet(key, d) {
  if (DEMO) return;
  try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), d })); } catch {}
}

/* =============================== player db =============================== */
async function loadPlayers() {
  const cached = lsGet("wc_players_v1", 24*3600*1000);
  if (cached) { S.players = cached; return; }
  if (!DEMO) setStatus("Downloading player database (~5 MB, cached for a day)…");
  const full = await sleeper("/players/nfl") || {};
  const trim = {};
  for (const [id, p] of Object.entries(full)) {
    if (!p || (!p.active && p.search_rank == null)) continue;
    trim[id] = { n: p.full_name || `${p.first_name||""} ${p.last_name||""}`.trim() || id,
      p: p.position || "?", t: p.team || null, a: p.age || null,
      r: (p.search_rank && p.search_rank < 9999999) ? p.search_rank : null };
  }
  S.players = trim;
  lsSet("wc_players_v1", trim);
}
function pinfo(id) {
  const p = S.players[id];
  if (p) return p;
  if (/^[A-Z]{2,3}$/.test(id)) return { n:`${id} D/ST`, p:"DEF", t:id, a:null, r:null };
  return { n:`Player ${id}`, p:"?", t:null, a:null, r:null };
}

/* =============================== values =============================== */
function leagueFormat() {
  const rp = S.league?.roster_positions || [];
  const sf = rp.includes("SUPER_FLEX") || rp.filter(x => x === "QB").length >= 2;
  const ppr = S.league?.scoring_settings?.rec ?? 1;
  const tep = (S.league?.scoring_settings?.bonus_rec_te || 0) > 0;
  return { numQbs: sf ? 2 : 1, ppr, tep, teams: S.league?.total_rosters || 12 };
}
async function loadValues() {
  const f = leagueFormat();
  const dyn = S.mode === "dynasty";
  const key = `wc_fc_${dyn}_${f.numQbs}_${f.teams}_${f.ppr}`;
  S.values = {}; S.picks = [];
  let rows = lsGet(key, 6*3600*1000);
  if (!rows) {
    try {
      rows = await getJSON(`${FC}?isDynasty=${dyn}&numQbs=${f.numQbs}&numTeams=${f.teams}&ppr=${f.ppr}`);
      if (Array.isArray(rows) && rows.length) lsSet(key, rows); else rows = null;
    } catch { rows = null; }
  }
  if (rows) {
    S.source = "fantasycalc";
    for (const row of rows) {
      const sid = row?.player?.sleeperId;
      const entry = { v: row.value || 0, rv: row.redraftValue || 0,
        ovr: row.overallRank ?? null,
        pr: row.positionRank ?? null, tr: row.trend30Day ?? 0,
        pos: row?.player?.position || null, name: row?.player?.name || null };
      if (sid != null && sid !== "") S.values[String(sid)] = entry;
      else if (dyn && /\b20\d{2}\b/.test(entry.name || "") ) S.picks.push(entry);
    }
    S.picks.sort((a,b) => b.v - a.v);
  } else {
    // Fallback: estimate from Sleeper's own search rank (exponential decay onto a 0–10k scale).
    S.source = "estimate";
    for (const [id, p] of Object.entries(S.players)) {
      if (p.r == null) continue;
      const v = Math.round(9999 * Math.exp(-(p.r - 1) / 85));
      if (v >= 5) S.values[id] = { v, ovr: p.r, pr: null, tr: 0, pos: p.p, name: p.n };
    }
  }
  $("#srcPill").textContent = S.source === "fantasycalc"
    ? `values: FantasyCalc (${dyn ? "dynasty" : "redraft"})` : "values: estimated";
  $("#srcPill").classList.toggle("warn", S.source === "estimate");
}
const val = (id) => S.values[id]?.v || 0;

/* =============================== production =============================== */
/* Layer 1 of the front office: what a player actually SCORED, versus what the
   market CHARGES for him. The gap between those two is the whole edge. */

async function loadStatsFor(season) {
  const key = `wc_stats_${season}`;
  const cached = lsGet(key, 12*3600*1000);
  if (cached) return cached;
  const raw = await getJSON(`${SLEEPER}/stats/nfl/regular/${season}`) || {};
  const trim = {};
  for (const [id, s] of Object.entries(raw)) {
    // Team defenses key as TEAM_XX here but as XX everywhere else; skip — the
    // DEF market is too thin to grade and would only add join bugs.
    if (!s || id.startsWith("TEAM_") || !(s.gp > 0)) continue;
    const ppr = s.pts_ppr || 0;
    if (ppr <= 0) continue;
    trim[id] = { ppr, half: s.pts_half_ppr ?? ppr, std: s.pts_std ?? ppr, gp: s.gp };
  }
  lsSet(key, trim);
  return trim;
}
/* Opportunity data, baked from nflverse and served beside this file. Browsers
   cannot fetch nflverse directly (its releases send no CORS headers), so the
   join happens offline and lands here as a same-origin file. It is a dated
   snapshot, not a live feed — the UI says so rather than implying otherwise. */
async function loadSignals() {
  try {
    // Always revalidate. A weekly job rewrites this file, and Pages caches it
    // hard enough that returning visitors would keep reading a stale snapshot
    // long after the refresh landed. no-cache still gets a cheap 304 when it
    // has not moved — it is the staleness that is expensive, not the request.
    const blob = await getJSON("./data/signals.json", 15000, { cache: "no-cache" });
    if (blob && blob.players) { S.sig = blob.players; S.sigMeta = blob.meta || null; return; }
  } catch {}
  S.sig = {}; S.sigMeta = null;
}

/* Value-path risk, baked from ~7 years of DynastyProcess weekly history by
   tools_build_risk.py. Optional file — the app works without it. */
async function loadRisk() {
  try {
    const blob = await getJSON("./data/risk.json", 15000, { cache: "no-cache" });
    if (blob && blob.players) { S.risk = blob.players; S.riskMeta = blob.meta || null; return; }
  } catch {}
  S.risk = {}; S.riskMeta = null;
}

async function loadStats() {
  // Preseason has no games yet, so last completed season is the honest baseline.
  // Once the year is underway we prefer live data, but only after enough of the
  // league has actually played — otherwise week 1 would grade everyone off one game.
  const cur = String(S.season), prev = String(Number(S.season) - 1);
  let season = cur, stats = {};
  if (S.seasonType && S.seasonType !== "pre") {
    stats = await loadStatsFor(cur);
    const deep = Object.values(stats).filter(s => s.gp >= MIN_GP).length;
    if (deep < 50) { season = prev; stats = await loadStatsFor(prev); }
  } else {
    stats = await loadStatsFor(prev);
    season = prev;
  }
  S.stats = stats || {};
  S.prodSeason = season;
}

/* Which Sleeper scoring column matches this league's reception settings. */
function statKey() {
  const ppr = leagueFormat().ppr;
  return ppr >= 1 ? "ppr" : ppr >= 0.5 ? "half" : "std";
}

/* Compare a player only against his own peer group, then ask: at his PRODUCTION
   rank inside that group, what does the market normally charge? The gap between
   that implied price and his real price is the edge.

   The peer group is position + age band in dynasty, because a dynasty price is a
   bet on future seasons — a 33-year-old outscoring his price is the age discount
   working as intended, not a bargain. Redraft buys one season only, so there age
   is irrelevant and the cohort is the whole position. */
const FULL_GP = 14;          // games needed before a sample carries full weight
const AGE_BANDS = [[24,"≤24"], [27,"25–27"], [30,"28–30"], [99,"31+"]];
const ageBand = (a) => a == null ? "?" : (AGE_BANDS.find(b => a <= b[0]) || AGE_BANDS[3])[1];

/* What a player is owed by his usage, regardless of whether the ball bounced in.
   Touchdowns are the least stable thing in football and opportunity is the most,
   so the two are kept apart: `ppg` is what he scored, `xppg` is what that same
   season looks like with lucky and unlucky touchdowns taken back out. */
function production(id) {
  const sg = S.sig?.[id];
  const yr = S.sigMeta?.latest;
  const s = sg && yr ? sg.s?.[yr] : null;
  if (s) return { ppg: s.ppg, xppg: s.xppg, gp: s.g, tdLuck: (s.td ?? 0) - (s.xtd ?? 0),
    wopr: s.wopr ?? null, ts: s.ts ?? null, snap: s.snp ?? null,
    tgt: s.tgt ?? 0, car: s.car ?? 0, draft: sg.d || null, src: "nflverse" };
  // Fallback to Sleeper's own season totals if the baked file is missing. No
  // opportunity data there, so luck cannot be separated — say so, don't fake it.
  const st = S.stats[id], k = statKey(), gp = st?.gp || 0;
  if (gp > 0) { const ppg = (st[k] ?? st.ppr ?? 0) / gp;
    return { ppg, xppg: ppg, gp, tdLuck: null, wopr: null, ts: null, snap: null,
      tgt: 0, car: 0, draft: null, src: "sleeper" }; }
  return null;
}

/* Who's the current starter at each NFL team+position, from ESPN's depth
   chart (via nflverse, refreshed ~daily). This needs no fantasy roster at all
   — it's the one signal in this app that works before either league drafts,
   because it's asking about NFL teams, not fantasy ones. */
function computeDepthIndex() {
  S.starterAt = {};                        // "TEAM|POS" -> sleeper id of the rank-1 guy
  for (const [id, sg] of Object.entries(S.sig || {})) {
    const dc = sg.dc; if (!dc || dc.rank !== 1) continue;
    S.starterAt[`${dc.team}|${dc.pos}`] = id;
  }
}

/* The bet dynasty value partly is: a young player who doesn't have the role
   yet, stuck behind a starter whose window is closing. Needs no production of
   his own to mean something — that's the point, and why it's kept distinct
   from Edge, which needs production to exist at all. */
function successionRead(id) {
  const dc = S.sig?.[id]?.dc;
  if (!dc || dc.rank === 1 || dc.rank > 3) return null;   // already starting, or too buried to matter
  const incId = S.starterAt[`${dc.team}|${dc.pos}`];
  if (!incId || incId === id) return null;
  const myAge = pinfo(id).a, incAge = pinfo(incId).a;
  if (myAge == null || incAge == null) return null;
  const myCurve = ageRead(id), incCurve = ageRead(incId);
  const stillDeveloping = myCurve && myCurve.cls === "diamond";           // ascending, per the position curve
  const incFading = (incCurve && ["hold","sell"].includes(incCurve.cls)) || (incAge - myAge >= 5);
  if (!stillDeveloping || !incFading) return null;
  // Filter out pure camp bodies: needs either real draft capital or some value
  // already recognized by the market, or this is noise, not a real bet.
  const d = draftRead(id);
  if (!(d && d.strong) && val(id) < 200) return null;
  const incName = S.values[incId]?.name || pinfo(incId).n;
  return { cls: "diamond", txt: `${dc.pos}${dc.rank} BEHIND ${incAge}yo`,
    incId, incName, myAge, incAge,
    why: `${dc.pos}${dc.rank} on ${dc.team} behind ${incName} (${incAge}` +
      (incCurve && incCurve.cls === "sell" ? `, past the ${dc.pos} peak window` :
       incCurve && incCurve.cls === "hold" ? `, on the back half of his prime` : "") +
      `). A real workload change is a roster move away, and the market isn't pricing for it yet.` };
}

function computeEdges() {
  const dyn = S.mode === "dynasty";
  S.edges = {};
  const cohorts = {};
  for (const [id, e] of Object.entries(S.values)) {
    const p = pinfo(id), pos = e.pos || p.p;
    if (!GROUPS.includes(pos)) continue;   // QB/RB/WR/TE — K and DEF markets are noise
    const pr = production(id);
    const band = dyn ? ageBand(p.a) : "all";
    // Rank on luck-adjusted points. Ranking on raw points prices a player's
    // touchdown variance as if it were skill, which is how a fully healthy
    // Justin Jefferson reads as the most overpriced man in the league.
    const rec = { id, v: e.v, ppg: pr?.xppg ?? 0, rawPpg: pr?.ppg ?? 0,
      gp: pr?.gp ?? 0, pos, band, pr };
    (cohorts[`${pos}|${band}`] ||= []).push(rec);
  }
  for (const [key, rows] of Object.entries(cohorts)) {
    const [pos, band] = key.split("|");
    const q = rows.filter(r => r.gp >= MIN_GP && r.ppg > 0 && r.v > 0);
    const small = q.length < 5;   // too few peers for a price ladder to mean anything
    const byPrice = [...q].sort((a,b) => b.v - a.v);
    const curve = byPrice.map(r => r.v);                       // the price ladder
    const priceRank = new Map(byPrice.map((r,i) => [r.id, i+1]));
    if (!small) [...q].sort((a,b) => b.ppg - a.ppg).forEach((r, i) => {
      const implied = curve[i] ?? 0;
      // Shrink toward zero on thin samples: eight games should not shout as loudly
      // as a full season. Straight-line confidence, easy to explain and to audit.
      const conf = Math.min(1, r.gp / FULL_GP);
      S.edges[r.id] = { pos, band, ppg: r.ppg, rawPpg: r.rawPpg, gp: r.gp, conf,
        prodRank: i+1, priceRank: priceRank.get(r.id), implied,
        rawEdge: implied - r.v, edge: Math.round((implied - r.v) * conf), cohort: q.length,
        tdLuck: r.pr?.tdLuck ?? null, wopr: r.pr?.wopr ?? null, ts: r.pr?.ts ?? null,
        snap: r.pr?.snap ?? null, tgt: r.pr?.tgt ?? 0, car: r.pr?.car ?? 0,
        draft: r.pr?.draft ?? null, src: r.pr?.src ?? null };
    });
    // Everyone else still gets a record, so the UI can say "not graded" and why,
    // rather than silently dropping rookies and injured players as if judged.
    for (const r of rows) if (!S.edges[r.id])
      S.edges[r.id] = { pos, band, ppg: r.ppg, rawPpg: r.rawPpg, gp: r.gp, conf: 0,
        prodRank: null, priceRank: null, implied: null, rawEdge: null, edge: null,
        cohort: q.length, smallCohort: small,
        tdLuck: r.pr?.tdLuck ?? null, wopr: r.pr?.wopr ?? null, ts: r.pr?.ts ?? null,
        snap: r.pr?.snap ?? null, tgt: r.pr?.tgt ?? 0, car: r.pr?.car ?? 0,
        draft: r.pr?.draft ?? null, src: r.pr?.src ?? null };
  }
}

/* A verdict, not a black box: every tag is a plain rule you can read off the row.
   Deliberately conservative — the engine's job is to raise questions worth asking,
   not to hand down judgements it cannot support. */
function edgeTag(id) {
  const e = S.edges[id];
  if (!e) return { cls:"nosample", txt:"—", why:"Not in the graded pool." };
  if (e.edge == null) {
    // A player with no snaps is not unknowable — where he was drafted is real
    // information, and it is the only thing a rookie has. Say that, rather than
    // filing the entire incoming class under "no data".
    const d = draftRead(id);
    if (!e.gp && d) return {
      cls: d.strong ? "buy" : "hold", txt: d.strong ? "CAPITAL" : "LOW CAPITAL",
      why: `No NFL production to judge yet. ${d.why} Draft position is the only signal here, so this is a prior, not a grade.` };
    return { cls:"nosample", txt:"NOT GRADED",
      why: e.smallCohort ? `Too few ${e.pos}s his age to build a fair comparison.`
         : e.gp ? `Only ${e.gp} game${e.gp === 1 ? "" : "s"} played — too thin to grade.`
         : "No games in the baseline season, so there is nothing to price against." };
  }
  const age = pinfo(id).a, tr = S.values[id]?.tr || 0, v = val(id);
  // Both floors matter. The implied floor keeps deep-bench noise out; the floor on
  // his ACTUAL price keeps out players the market has written off entirely — a man
  // valued at 70 who out-ranks a thin rookie cohort is not a diamond, he is a rounding error.
  const material = v >= 500 && e.implied >= 1000;
  const sample = e.gp < FULL_GP ? ` (${e.gp}-game sample, so the number is damped)` : "";
  const line = `Produces like ${e.pos}${e.prodRank} of ${e.cohort} in the ${e.band} group, priced like ${e.pos}${e.priceRank}`;
  if (!material || Math.abs(e.edge) < 500)
    return { cls:"hold", txt:"HOLD", why: material ? "Price and production roughly agree."
      : "Too lightly valued to trade on — the comparison is not meaningful this far down the board." };
  if (e.edge > 0) {
    if (S.mode === "dynasty" && age && age <= 24)
      return { cls:"diamond", txt:"DIAMOND", why:`${line}, and he is only ${age}.${sample}` };
    if (S.mode === "dynasty" && age && age >= 29)
      return { cls:"rental", txt:"RENTAL", why:`${line}, but he is ${age} — a win-now rental, not a foundation piece.${sample}` };
    return { cls:"buy", txt:"BUY", why:`${line}.${sample}` };
  }
  // An elite price is the market's multi-year conviction. One weak season is not
  // enough to overturn it, so flag the disagreement without calling it a sell.
  // Scaled to cohort size — a fixed cut-off would make every player in a small
  // group untouchable and no player in a large one protected.
  if (e.priceRank <= Math.max(5, Math.ceil(e.cohort * 0.25)))
    return { cls:"hold", txt:"WATCH", why:`${line} — but an elite price reflects years of evidence, ` +
      `and one down season rarely overturns it. Worth watching, not dumping.${sample}` };
  return { cls:"sell", txt:"SELL", why:`${line}` +
    (tr > 0 ? " — and the market is still climbing, so the window to move him is open." : ".") + sample };
}
/* Opportunity, graded on the scale that fits the position. WOPR blends target
   share with air-yards share and is the best single usage number for a pass
   catcher; backs live on touches with snap share as the gate. */
function opportunity(id) {
  const e = S.edges[id]; if (!e) return null;
  const pos = e.pos;
  if (pos === "WR" || pos === "TE") {
    if (e.wopr == null) return null;
    const w = e.wopr;
    return { val: w, txt: w.toFixed(2), lab: "WOPR",
      tier: w >= 0.70 ? "elite" : w >= 0.55 ? "strong" : w >= 0.35 ? "rotational" : "thin",
      why: `${(e.ts*100 || 0).toFixed(0)}% target share` + (e.snap != null ? `, ${(e.snap*100).toFixed(0)}% of snaps` : "") };
  }
  if (pos === "RB") {
    const touches = (e.car || 0) + (e.tgt || 0);
    if (!touches) return null;
    return { val: touches / 25, txt: touches.toFixed(1), lab: "touch/gm",
      tier: touches >= 18 ? "elite" : touches >= 13 ? "strong" : touches >= 8 ? "rotational" : "thin",
      why: `${(e.car||0).toFixed(1)} carries + ${(e.tgt||0).toFixed(1)} targets a game` +
        (e.snap != null ? `, ${(e.snap*100).toFixed(0)}% of snaps` : "") };
  }
  if (pos === "QB") {
    if (e.snap == null) return null;
    return { val: e.snap, txt: (e.snap*100).toFixed(0) + "%", lab: "snaps",
      tier: e.snap >= 0.90 ? "elite" : e.snap >= 0.6 ? "strong" : "rotational",
      why: "share of his offense's snaps" };
  }
  return null;
}

/* Touchdowns regress harder than anything else a player does, which makes the
   gap between scored and expected the most reliable mispricing signal there is.
   Negative luck on heavy usage is the buy; positive luck on light usage is the sell. */
function luckRead(id) {
  const e = S.edges[id];
  if (!e) return null;
  // Prefer the full expected-points gap (ffverse xFP: yardage, completions and
  // touchdowns priced per play) over the in-house TD-only line when it shipped.
  const fxd = S.sig?.[id]?.s?.[S.sigMeta?.latest]?.fxd;
  if (fxd != null) {
    if (fxd <= -1.5) return { cls:"buy", txt:`${fxd.toFixed(1)}/gm`, dir:"unlucky",
      why:`Scored ${Math.abs(fxd).toFixed(1)} points a game below what his opportunities were worth (ffverse expected-points model). The opportunities are the part that carries over.` };
    if (fxd >= 1.5) return { cls:"sell", txt:`+${fxd.toFixed(1)}/gm`, dir:"lucky",
      why:`Scored ${fxd.toFixed(1)} points a game above what his opportunities were worth. That overshoot is the least repeatable part of his season.` };
    return { cls:"hold", txt:(fxd>0?"+":"")+fxd.toFixed(1)+"/gm", dir:"neutral",
      why:"Scoring landed about where his opportunities said it should (ffverse expected-points model)." };
  }
  if (e.tdLuck == null) return null;
  const l = e.tdLuck;
  if (l <= -2) return { cls:"buy", txt:`${l.toFixed(1)} TD`, dir:"unlucky",
    why:`Scored ${Math.abs(l).toFixed(1)} fewer touchdowns than his volume implied. Touchdowns regress; the usage is what carries over.` };
  if (l >= 2) return { cls:"sell", txt:`+${l.toFixed(1)} TD`, dir:"lucky",
    why:`Scored ${l.toFixed(1)} more touchdowns than his volume implied. That part of last season is the least likely to repeat.` };
  return { cls:"hold", txt: (l>0?"+":"") + l.toFixed(1) + " TD", dir:"neutral",
    why:"Touchdowns landed about where his volume said they should." };
}

/* Draft capital, the only real signal a player with no NFL snaps has. The
   evidence behind it is strongest at receiver — most top-50 fantasy WRs came out
   of the first three rounds — and admittedly murkier at running back, where the
   league's own devaluation of the position muddies it. The read says which. */
const CAPITAL = [[15,"premium","a top-15 pick"], [45,"early","a first or second rounder"],
                 [105,"mid","a day-two pick"], [999,"late","a late-round pick"]];
function draftRead(id) {
  const e = S.edges[id], d = e?.draft || S.sig?.[id]?.d;
  if (!d) return null;
  const [, tier, phrase] = CAPITAL.find(c => d.pk <= c[0]) || CAPITAL[3];
  const pos = e?.pos || S.sig?.[id]?.pos;
  const strong = tier === "premium" || tier === "early";
  const caveat = pos === "RB"
    ? " Draft capital is a weaker guide at running back than anywhere else."
    : pos === "WR" && strong
      ? " Draft capital carries most at receiver, where nearly all top-50 fantasy seasons come from the first three rounds."
      : "";
  return { tier, strong, txt: `R${d.rd}.${String(d.pk).padStart(2,"0")}`,
    why: `${d.yr} draft, ${phrase} (round ${d.rd}, pick ${d.pk}).${caveat}` };
}

/* Usage direction. A player whose opportunity is climbing is the one worth
   getting to before the scoring catches up; opportunity moves before points do. */
function usageTrend(id) {
  const sg = S.sig?.[id];
  const yrs = S.sigMeta?.seasons;
  if (!sg || !yrs || yrs.length < 2) return null;
  const cur = sg.s?.[S.sigMeta.latest];
  const prevYr = [...yrs].filter(y => y !== S.sigMeta.latest).sort().pop();
  const prev = sg.s?.[prevYr];
  if (!cur || !prev) return null;
  const pos = sg.pos;
  const pick = (s) => pos === "RB" ? (s.car || 0) + (s.tgt || 0)
    : pos === "QB" ? (s.snp ?? 0) * 100 : (s.wopr ?? 0) * 100;
  const a = pick(prev), b = pick(cur);
  if (!a && !b) return null;
  const d = b - a;
  const unit = pos === "RB" ? "touches/gm" : pos === "QB" ? "pts of snap share" : "pts of WOPR";
  const big = Math.abs(d) >= (pos === "RB" ? 3 : 8);
  return { d, big, dir: d > 0 ? "up" : d < 0 ? "down" : "flat",
    txt: (d > 0 ? "▲" : d < 0 ? "▼" : "·") + " " + Math.abs(d).toFixed(pos === "RB" ? 1 : 0),
    why: `Usage ${d > 0 ? "climbed" : "fell"} ${Math.abs(d).toFixed(1)} ${unit} from ${esc(prevYr)} to ${esc(S.sigMeta.latest)}.` };
}

/* Where a player sits on his position's age curve. The shapes are well
   established even if the exact ages shift a year either way by study: backs
   peak early and fall off a cliff, receivers peak later and hold on far longer,
   tight ends peak latest of all. */
const CURVES = {
  RB: { peak:[24,26], cliff:29, note:"Backs peak at 24–26; nearly every peak season happens before 29." },
  WR: { peak:[26,28], cliff:31, note:"Receivers peak around 26–28 and hold value years longer than backs." },
  TE: { peak:[26,29], cliff:32, note:"Tight ends peak latest and hold the longest window of the skill positions." },
  QB: { peak:[27,32], cliff:37, note:"Quarterbacks hold value longest of anyone." },
};
function ageRead(id) {
  const p = pinfo(id), e = S.edges[id];
  const pos = e?.pos || S.sig?.[id]?.pos;
  const c = CURVES[pos];
  if (!c || !p.a) return null;
  const a = p.a;
  if (a < c.peak[0]) return { cls:"diamond", txt:"ASCENDING", why:`${a} — still short of the ${pos} peak. ${c.note}` };
  if (a <= c.peak[1]) return { cls:"buy", txt:"PEAK", why:`${a} — squarely in the ${pos} peak window. ${c.note}` };
  if (a < c.cliff) return { cls:"hold", txt:"POST-PEAK", why:`${a} — past the peak but before the drop. ${c.note}` };
  return { cls:"sell", txt:"CLIFF", why:`${a} — past the age where ${pos}s hold value. ${c.note}` };
}

/* The classic post-hype shape: real draft capital, still young, has not produced,
   and the market has stopped paying for him. The community treats this as a known
   inefficiency; the honest caveat is that it is far less rigorously demonstrated
   than touchdown regression, so it is surfaced as a question, not a verdict. */
function postHype(id) {
  const e = S.edges[id], d = draftRead(id), p = pinfo(id);
  if (!e || !d || !d.strong || !p.a || p.a > 25) return null;
  // Skill positions only. A quarterback's opportunity is binary — he starts or
  // he does not — and WOPR is ~0 for all of them, so judging QBs on it flags
  // every young passer in the league, starters included.
  if (!["RB","WR","TE"].includes(e.pos)) return null;
  const sg = S.sig?.[id]?.s?.[S.sigMeta?.latest];
  if (!sg || sg.g < 6) return null;
  const weak = (e.pos === "RB" ? (sg.car + sg.tgt) < 10 : (sg.wopr ?? 0) < 0.45);
  const v = val(id);
  if (!weak || v > 3000 || v < 300) return null;   // too dear to be forgotten, too cheap to matter
  return { why: `Real draft capital (${d.txt}), still only ${p.a}, and the market has stopped paying for him. ` +
    `That is the shape a post-hype breakout takes — though this pattern is community lore more than proven research, so treat it as a question worth asking.` };
}

/* The board score: usage he has earned, luck he has not, and a price that has
   not caught up. Deliberately additive and inspectable rather than a fitted model —
   every point of it can be read off the row it came from. */
function boardScore(id) {
  const e = S.edges[id]; if (!e || e.edge == null) return null;
  const o = opportunity(id), l = e.tdLuck;
  if (!o || l == null) return null;
  const oppBoost = { elite: 1.0, strong: 0.6, rotational: 0.25, thin: 0 }[o.tier] ?? 0;
  // Unlucky players score higher on the buy board, lucky ones on the sell board.
  return e.edge + (-l * 220) + (oppBoost * 900);
}
/* Next season's points per game, from a model fitted offline and baked in.
   Shown with its measured error, because a single confident number would be a
   lie: held out of sample it beats reusing last year's points by 7-13%, which
   is a real edge and a modest one. */
function projection(id) {
  const p = S.sig?.[id]?.proj;
  const m = S.sigMeta?.model;
  if (p == null || !m) return null;
  const err = m.rmse || 3.3;
  return { ppg: p, lo: Math.max(0, p - err), hi: p + err, rmse: err, projects: m.projects,
    why: `Projected ${p.toFixed(1)} points a game in ${m.projects}, give or take ${err.toFixed(1)}. ` +
      `Fitted on the ${m.trainedOn} transition; out of sample it beats simply reusing last season by 7–13%.` };
}

/* Two independent markets, and the gap between them. FantasyCalc prices from
   actual trades; DynastyProcess from expert consensus rankings. Agreement means
   the price is settled. A wide gap means one of them is wrong, and that is a far
   better mispricing signal than trusting either on its own. */
function marketSplit(id) {
  const r = S.mktRank?.[id];
  if (!r) return null;
  const d = r.dp - r.fc;                       // positive = consensus rates him lower
  // Ranks near the bottom of a position are noise; a gap of a few places is not
  // a disagreement. Both markets must roster him and the gap must be real.
  if (Math.max(r.fc, r.dp) > 60 || Math.abs(d) < 8) return null;
  return { fcRank: r.fc, dpRank: r.dp, gap: d, pos: r.pos,
    dir: d > 0 ? "dear-here" : "cheap-here",
    txt: (d > 0 ? "+" : "") + d,
    why: d < 0
      ? `FantasyCalc has him ${r.pos}${r.fc}; the expert consensus has him ${r.pos}${r.dp} — ${Math.abs(d)} places higher. Two independent markets disagree, and that gap is where mispricing lives.`
      : `FantasyCalc has him ${r.pos}${r.fc} but the consensus has him only ${r.pos}${r.dp}, ${d} places lower. Worth knowing before you pay the trade-based price.` };
}
/* Rank each player inside each market separately. Comparing ranks rather than
   values sidesteps the fact that the two shops use different scales AND
   differently shaped curves — one multiplier cannot reconcile those, and trying
   made every player look mispriced in the same direction. */
function calibrateMarkets() {
  const f = leagueFormat();
  const fcBy = {}, dpBy = {};
  for (const [id, sg] of Object.entries(S.sig || {})) {
    const pos = sg.pos;
    if (!GROUPS.includes(pos)) continue;
    const v = val(id), o = f.numQbs === 2 ? (sg.dp?.v2 || sg.dp?.v1) : sg.dp?.v1;
    if (v > 0 && o > 0) { (fcBy[pos] ||= []).push([id, v]); (dpBy[pos] ||= []).push([id, o]); }
  }
  S.mktRank = {};
  for (const pos of Object.keys(fcBy)) {
    const rank = (arr) => { const m = {};
      [...arr].sort((a,b) => b[1]-a[1]).forEach(([id], i) => m[id] = i+1); return m; };
    const rf = rank(fcBy[pos]), rd = rank(dpBy[pos]);
    for (const id of Object.keys(rf)) S.mktRank[id] = { fc: rf[id], dp: rd[id], pos };
  }
}

/* How turbulent this player's market value has actually been, against players
   of his own position and price tier. Measured on share of the total market
   (the value scale itself inflates), over the trailing ~2 years of weekly
   DynastyProcess history. Survivorship makes every drawdown a floor: players
   who crash out of the file stop reporting before the bottom. */
function riskRead(id) {
  const r = S.risk?.[id], meta = S.riskMeta;
  if (!r || !meta?.arch) return null;
  const tier = r.cur > 100 ? "elite" : r.cur > 10 ? "startable" : "tail";
  const peer = meta.arch[`${r.pos}_${tier}`];
  if (!peer) return null;
  const ratio = peer.vol_med > 0 ? r.vol / peer.vol_med : 1;
  const ratioD = peer.mdd_med > 0 ? r.mdd / peer.mdd_med : 1;
  // Labels are RELATIVE to position-and-tier peers: the median startable player
  // slides 70%+ inside two years, so an absolute threshold marks nearly the
  // whole league FRAGILE and the chip stops meaning anything. One absolute
  // floor survives: no 60%+ slide gets called steady, whatever his new
  // neighbours look like — that's how a crashed Kelce briefly read STEADY.
  const cls = (ratio >= 1.4 || ratioD >= 1.25) ? "sell"
            : (ratio <= 0.7 && r.mdd < 0.6) ? "buy" : "hold";
  const label = cls === "buy" ? "STEADY" : cls === "sell" ? "FRAGILE" : "TYPICAL";
  const tierTxt = tier === "tail" ? "deep" : tier;
  return { cls, txt: label, vol: r.vol, mdd: r.mdd, tier,
    why: `Worst slide of the last two years: ${(r.mdd*100).toFixed(0)}% off its peak ` +
      `(the median ${tierTxt} ${r.pos} slides ${(peer.mdd_med*100).toFixed(0)}%). Week-to-week his price is ` +
      `${ratio <= 0.7 ? "notably calmer than" : ratio >= 1.4 ? `${ratio.toFixed(1)}× as turbulent as` : "about as turbulent as"} ` +
      `his peers'. Players who crash out of the data entirely stop reporting, so every drawdown here is a floor, not a ceiling.` };
}

/* The market's explicit price for youth: redraft value (this season only) over
   dynasty value (the career). The ratio itself is a fact, not a theory — both
   numbers come from the same trade market. What's only SUGGESTIVE is the
   exploit: value-matched vets out-produced their dynasty price in all three
   windows tested, but never past the permutation court (p 0.09-0.23). */
function ageTax(id) {
  const e = S.values[id];
  if (!e || !e.v || !e.rv || e.v < 300) return null;
  const ratio = e.rv / e.v;
  if (ratio >= 1.15) return { cls: "buy", txt: "WIN-NOW +" + Math.round((ratio - 1) * 100) + "%", ratio,
    why: `Worth ${Math.round((ratio - 1) * 100)}% more for this season alone than his full dynasty price — the market is discounting his future hard. In the three windows tested, vets priced like this out-produced their cost every time (though never past the chance bar), and for a team competing now the discount is the point.` };
  if (ratio <= 0.65) return { cls: "sell", txt: "FUTURE " + Math.round((1 - ratio) * 100) + "%", ratio,
    why: `${Math.round((1 - ratio) * 100)}% of his dynasty price is a bet on seasons he hasn't played yet — you're buying years, not points. Fine for a rebuild; expensive for a team trying to win now.` };
  return null;
}

/* Everything the app knows about one player, as sentences. Assembled in one
   place so the board, the wire and the roster all explain themselves identically. */
function fullRead(id, extra) {
  const name = S.values[id]?.name || pinfo(id).n;
  const parts = [];
  const push = (s) => { if (s) parts.push(`<div class="tt-row"><span>${esc(s)}</span></div>`); };
  const o = opportunity(id), l = luckRead(id), t = usageTrend(id),
        a = ageRead(id), d = draftRead(id), ph = postHype(id),
        pj = projection(id), ms = marketSplit(id), sc = successionRead(id),
        rk = riskRead(id), at = ageTax(id);
  push(edgeTag(id).why);
  if (pj) push(pj.why);
  if (ms && ms.dir !== "agree") push(ms.why);
  if (o) push(o.why);
  if (l) push(l.why);
  if (t && t.big) push(t.why);
  if (a) push(a.why);
  if (d && !S.edges[id]?.gp) push(null);            // already said in the tag
  else if (d && d.strong) push(d.why);
  if (ph) push(ph.why);
  if (sc) push(sc.why);
  if (rk && rk.cls !== "hold") push(rk.why);
  if (at) push(at.why);
  (extra || []).forEach(push);
  return `<div class="tt-title">${esc(name)}</div>` + parts.join("");
}
const edgeCell = (id) => {
  const e = S.edges[id];
  if (!e || e.edge == null) return '<span style="color:var(--ink-muted)">—</span>';
  const s = e.edge > 0 ? "+" : "";
  return `<span class="${e.edge > 0 ? "edge-pos" : e.edge < 0 ? "edge-neg" : ""}">${s}${fmt(e.edge)}</span>`;
};

/* =============================== derived =============================== */
function teamName(rid) {
  const roster = S.rosters.find(r => r.roster_id === rid);
  const u = S.lusers.find(u => u.user_id === roster?.owner_id);
  return u?.metadata?.team_name || u?.display_name || `Roster ${rid}`;
}
function starterValue(roster) {
  const slots = (S.league?.roster_positions || []).filter(s => !["BN","IR","TAXI"].includes(s));
  const pool = new Map((roster.players || []).filter(id => id && id !== "0")
    .map(id => [id, { pos: pinfo(id).p, v: val(id) }]));
  // Single-position slots claim first, flexes after, best value wins each slot.
  const order = [...slots].sort((a,b) =>
    (POS_SLOTS[a]?.length || 9) - (POS_SLOTS[b]?.length || 9));
  let total = 0;
  for (const slot of order) {
    const ok = POS_SLOTS[slot]; if (!ok) continue;
    let best = null;
    for (const [id, p] of pool) if (ok.includes(p.pos) && (!best || p.v > pool.get(best).v)) best = id;
    if (best) { total += pool.get(best).v; pool.delete(best); }
  }
  return total;
}
function teamSummaries() {
  return S.rosters.map(r => {
    const ids = (r.players || []).filter(id => id && id !== "0");
    const byPos = { QB:0, RB:0, WR:0, TE:0, OTH:0 };
    const assets = [];
    let ageWt = 0, ageV = 0;
    for (const id of ids) {
      const p = pinfo(id), v = val(id);
      byPos[GROUPS.includes(p.p) ? p.p : "OTH"] += v;
      assets.push({ id, name: p.n, pos: p.p, v });
      if (p.a && v) { ageWt += p.a * v; ageV += v; }
    }
    assets.sort((a,b) => b.v - a.v);
    const total = Object.values(byPos).reduce((a,b) => a+b, 0);
    return { rid: r.roster_id, name: teamName(r.roster_id), roster: r, total, byPos,
      starters: starterValue(r), assets, age: ageV ? ageWt/ageV : null,
      me: r.roster_id === S.myRosterId };
  }).sort((a,b) => b.total - a.total);
}

/* =============================== trade finder =============================== */
/* Same slot-fill as starterValue, but keeping the position breakdown instead of
   collapsing it to one number — this is what "need" and "surplus" are measured
   against. A team's starter total can look fine while it's one hit away from a
   hole at RB2; the aggregate hides exactly the thing a trade would fix. */
function rosterBreakdown(roster) {
  const slots = (S.league?.roster_positions || []).filter(s => !["BN","IR","TAXI"].includes(s));
  const pool = new Map((roster.players || []).filter(id => id && id !== "0")
    .map(id => [id, { pos: pinfo(id).p, v: val(id) }]));
  const order = [...slots].sort((a,b) => (POS_SLOTS[a]?.length || 9) - (POS_SLOTS[b]?.length || 9));
  const starterByPos = { QB:0, RB:0, WR:0, TE:0 }, starterIds = new Set();
  for (const slot of order) {
    const ok = POS_SLOTS[slot]; if (!ok) continue;
    let best = null;
    for (const [id, p] of pool) if (ok.includes(p.pos) && (!best || p.v > pool.get(best).v)) best = id;
    if (best) { const p = pool.get(best);
      if (GROUPS.includes(p.pos)) starterByPos[p.pos] += p.v;
      starterIds.add(best); pool.delete(best); }
  }
  const benchByPos = { QB:0, RB:0, WR:0, TE:0 }, benchDepth = { QB:0, RB:0, WR:0, TE:0 };
  for (const [id, p] of pool) if (GROUPS.includes(p.pos)) {
    benchByPos[p.pos] += p.v;
    if (p.v >= 500) benchDepth[p.pos]++;         // rosterable, not deep-bench noise
  }
  return { starterByPos, benchByPos, benchDepth, starterIds };
}

function leagueNeeds() {
  const teams = S.rosters.map(r => ({ rid: r.roster_id, bd: rosterBreakdown(r) }));
  const median = (arr) => { const s = [...arr].sort((a,b) => a-b), n = s.length;
    return n ? (n % 2 ? s[(n-1)/2] : (s[n/2-1] + s[n/2]) / 2) : 0; };
  const med = {};
  for (const g of GROUPS) med[g] = median(teams.map(t => t.bd.starterByPos[g] || 0));
  return { med, byTeam: Object.fromEntries(teams.map(t => [t.rid, t.bd])) };
}

/* Contender / fringe / rebuilder, from roster shape rather than record — a
   startup dynasty league has no games played yet, so wins can't classify
   anyone. A team built to win now stacks starter value; a team building for
   later stockpiles youth. Both are visible before a single snap is played. */
function teamArchetype(rid, teams) {
  const n = teams.length;
  const t = teams.find(x => x.rid === rid);
  if (!t) return null;
  const starterRank = [...teams].sort((a,b) => b.starters - a.starters).findIndex(x => x.rid === rid) + 1;
  const ageRank = [...teams].filter(x => x.age).sort((a,b) => a.age - b.age).findIndex(x => x.rid === rid) + 1;
  if (starterRank <= Math.ceil(n/3)) return { cls: "contender", why: `#${starterRank} of ${n} in starter value` };
  if (t.age && ageRank <= Math.ceil(n/3) && starterRank > Math.ceil(n*2/3))
    return { cls: "rebuilder", why: `#${starterRank} in starters but the youngest core in the league` };
  return { cls: "fringe", why: `#${starterRank} of ${n} — not clearly buying or selling` };
}

/* One trade package between my team and one opponent. Tries 1-for-1 first,
   then a 2-for-1 consolidation (your depth for their one difference-maker) —
   the shape a pick-poor team actually needs, since you can't buy up with picks
   you don't have. Every candidate is scored on three things: does the value
   check out, does it fill an actual hole on both sides, and does it move Edge
   in the acquirer's favor. Fairness dominates the score; edge and need only
   break ties, because a "great edge" trade nobody would accept is not a trade. */
function bestPackage(myRid, oppRid, needs) {
  const myBd = needs.byTeam[myRid], opBd = needs.byTeam[oppRid];
  if (!myBd || !opBd) return null;
  const myRoster = S.rosters.find(r => r.roster_id === myRid);
  const opRoster = S.rosters.find(r => r.roster_id === oppRid);
  const need = (bd, g) => bd.starterByPos[g] < needs.med[g] * 0.85;
  const surplus = (bd, g) => bd.benchDepth[g] >= 2 || bd.starterByPos[g] > needs.med[g] * 1.15;

  const rosterAssets = (roster, excludeStarters) => (roster.players || [])
    .filter(id => id && id !== "0" && GROUPS.includes(pinfo(id).p) && val(id) >= 300)
    .map(id => ({ id, pos: pinfo(id).p, v: val(id), tag: edgeTag(id).cls,
                  starter: rosterBreakdown(roster).starterIds.has(id) }))
    .filter(a => !excludeStarters || true);       // starters stay eligible; casual leagues trade them

  const getPool = rosterAssets(opRoster).sort((a,b) => {
    const pref = { diamond:3, buy:2, rental:1 }; return (pref[b.tag]||0) - (pref[a.tag]||0) || b.v - a.v; });
  const givePool = rosterAssets(myRoster).sort((a,b) => {
    const pref = { sell:3, hold:2, watch:1 }; return (pref[b.tag]||0) - (pref[a.tag]||0) || b.v - a.v; })
    .filter(a => a.tag !== "diamond");             // don't offer away your own mispriced gems

  const myDeficit = GROUPS.filter(g => need(myBd, g));
  const opDeficit = GROUPS.filter(g => need(opBd, g));
  const opSurplusForMe = GROUPS.filter(g => myDeficit.includes(g) && surplus(opBd, g));
  const mySurplusForThem = GROUPS.filter(g => opDeficit.includes(g) && surplus(myBd, g));

  const score = (give, get) => {
    const gv = give.reduce((s,x) => s+x.v, 0), tv = get.reduce((s,x) => s+x.v, 0);
    if (!gv || !tv) return null;
    const fair = 1 - Math.abs(gv-tv) / Math.max(gv,tv);
    if (fair < 0.72) return null;                  // too lopsided to be a real proposal
    const edgeGain = get.reduce((s,x) => s + (S.edges[x.id]?.edge || 0), 0)
                    - give.reduce((s,x) => s + (S.edges[x.id]?.edge || 0), 0);
    const needFit = (get.some(x => myDeficit.includes(x.pos)) ? 1 : 0)
                   + (give.some(x => opDeficit.includes(x.pos)) ? 1 : 0);
    return { give, get, gv, tv, fair, edgeGain, needFit,
      s: fair*1000 + Math.max(-1500, Math.min(1500, edgeGain))*0.3 + needFit*350 };
  };

  const candidates = [];
  const getFrom = (pos) => getPool.filter(x => !pos.length || pos.includes(x.pos));
  const giveFrom = (pos) => givePool.filter(x => !pos.length || pos.includes(x.pos));
  // Need-matched and unfiltered lists overlap by construction — a need-matched
  // player IS also in the unfiltered pool — so concatenating them puts the same
  // id at two array indices. Deduping by id before pairing is what stops the
  // 2-for-1 search from "trading" a player for himself.
  const dedupe = (list) => { const seen = new Set();
    return list.filter(x => seen.has(x.id) ? false : (seen.add(x.id), true)); };

  // 1-for-1, need-matched first, falling back to any reasonable value match
  const oneForOneGets = dedupe(getFrom(opSurplusForMe).slice(0, 6).concat(getFrom([]).slice(0, 4)));
  const oneForOneGives = dedupe(giveFrom(mySurplusForThem).slice(0, 6).concat(giveFrom([]).slice(0, 4)));
  for (const get of oneForOneGets) {
    for (const give of oneForOneGives) {
      if (give.id === get.id) continue;
      const r = score([give], [get]); if (r) candidates.push(r);
    }
  }
  // 2-for-1: my two depth pieces for their one difference-maker
  const bigGets = dedupe(getFrom(opSurplusForMe).slice(0, 4).concat(getFrom([]).slice(0, 3)));
  const smallGives = dedupe(giveFrom(mySurplusForThem).concat(giveFrom([])))
    .filter(x => !x.starter || x.v < 3500);
  for (const get of bigGets) {
    for (let i = 0; i < smallGives.length; i++) for (let j = i+1; j < smallGives.length; j++) {
      const a = smallGives[i], b = smallGives[j];
      if (a.id === get.id || b.id === get.id) continue;
      const r = score([a,b], [get]); if (r) candidates.push(r);
    }
  }
  if (!candidates.length) return null;
  candidates.sort((a,b) => b.s - a.s);
  return candidates[0];
}

/* Across the whole league: one best idea per opponent, ranked. This is the
   "every team" sweep — it does not stop at the first good-looking trade, it
   checks all of them and surfaces the strongest. */
function generateTradeIdeas() {
  if (!S.myRosterId) return [];
  const teams = teamSummaries();
  const needs = leagueNeeds();
  const myArch = teamArchetype(S.myRosterId, teams);
  const ideas = [];
  for (const t of teams) {
    if (t.rid === S.myRosterId) continue;
    if (!(t.roster.players || []).length) continue;    // nothing to trade for
    const pkg = bestPackage(S.myRosterId, t.rid, needs);
    if (pkg) ideas.push({ oppRid: t.rid, oppName: t.name,
      oppArch: teamArchetype(t.rid, teams), ...pkg });
  }
  ideas.sort((a,b) => b.s - a.s);
  return { ideas, myArch, needs, teams };
}

/* =============================== tooltip =============================== */

  const pad = 14, w = tt.offsetWidth, h = tt.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;

  if (y + h > innerHeight - 8) y = ev.clientY - h - pad;
  tt.style.left = x + "px"; tt.style.top = y + "px";
}

/* ---------- power rankings ---------- */

    stats.append(
      statTile("Your team value", fmt(mine.total), `#${teams.indexOf(mine)+1} of ${teams.length} overall`),
      statTile("Your starters", fmt(mine.starters), `#${sr.indexOf(mine)+1} starting lineup`),
      statTile("Weighted age", mine.age ? mine.age.toFixed(1) : "—",
        mine.age ? (mine.age < avgAge(teams) ? "younger than league avg" : "older than league avg") : ""),
      statTile("Top asset", mine.assets[0] ? mine.assets[0].name : "—",
        mine.assets[0] ? `${fmt(mine.assets[0].v)} — ${esc(mine.assets[0].pos)}` : ""));

  const card = el("div", "card");

      el("div", "team", esc(t.name) + (t.me ? '<span class="you">YOU</span>' : "")));
    const bar = el("div", "bar");
    const segs = [...GROUPS.map(g => [g, t.byPos[g], `var(${GROUP_VARS[g]})`]),
                  ["Other", t.byPos.OTH, "var(--baseline)"]].filter(s => s[1] > 0);
    for (const [g, amt, color] of segs) {
      const seg = el("div", "segm");
      seg.style.width = (amt / max * 100) + "%";
      seg.style.background = color;
      const top = t.assets.filter(a => (GROUPS.includes(a.pos) ? a.pos : "Other") === g).slice(0, 3);
      const html = `<div class="tt-title">${esc(t.name)} — ${g}: ${fmt(amt)}</div>` +
        top.map(a => `<div class="tt-row"><span>${esc(a.name)}</span><span>${fmt(a.v)}</span></div>`).join("");
      seg.addEventListener("mousemove", ev => showTT(html, ev));
      seg.addEventListener("mouseleave", hideTT);
      // Touch has no hover: tap a segment to pin the same tooltip.
      seg.addEventListener("click", ev => { showTT(html, ev); ev.stopPropagation(); });
      bar.append(seg);
    }
    row.append(bar, el("div", "val", fmt(t.total)));
    card.append(row);
  });
  v.append(card);
}
function statTile(lab, valTxt, sub) {

const avgAge = (teams) => { const withAge = teams.filter(t => t.age);
