/* ---------- trade calculator ---------- */
function tradePool() {
  const inLeague = new Map();
  for (const r of S.rosters) for (const id of (r.players || []))
    if (id && id !== "0") inLeague.set(id, teamName(r.roster_id));
  const pool = [];
  for (const [id, e] of Object.entries(S.values)) {
    const p = pinfo(id);
    pool.push({ kind:"player", id, name: e.name || p.n, pos: e.pos || p.p, v: e.v,
      owner: inLeague.get(id) || null });
  }
  S.picks.forEach((pk, i) => pool.push({ kind:"pick", id:"pick"+i, name: pk.name, pos:"PICK", v: pk.v, owner:null }));
  return pool.sort((a,b) => b.v - a.v);
}
/* Every signal this app has on one asset, compressed to a chip row. The trade
   calculator is the tool this whole build points at — showing raw price here
   and nothing else would mean everything upstream never reaches the moment
   it's meant to inform. Picks and ungraded players get nothing; there's
   nothing honest to show them yet. */
function assetSignals(id) {
  if (!S.edges[id]) return null;               // picks, or players with no edge record
  const t = edgeTag(id), l = luckRead(id), a = ageRead(id), ms = marketSplit(id), ph = postHype(id);
  return { t, l, a, ms, ph };
}
function sigChips(id) {
  const s = assetSignals(id);
  if (!s) return null;
  const row = el("div", "sig-chips");
  if (s.t && s.t.cls !== "hold" && s.t.cls !== "nosample")
    row.append(el("span", `tag ${s.t.cls}`, esc(s.t.txt)));
  if (s.l && s.l.cls !== "hold") row.append(el("span", `tag ${s.l.cls}`, esc(s.l.txt)));
  if (s.a && ["diamond","sell"].includes(s.a.cls)) row.append(el("span", `tag ${s.a.cls}`, esc(s.a.txt)));
  if (s.ms && s.ms.dir !== "agree") row.append(el("span", `tag ${s.ms.dir === "cheap-here" ? "buy" : "sell"}`,
    `mkt ${esc(s.ms.txt)}`));
  if (s.ph) row.append(el("span", "tag diamond", "POST-HYPE"));
  return row.children.length ? row : null;
}

function renderTrade(v) {
  const pool = tradePool();
  const wrap = el("div", "grid2");
  wrap.append(tradeSide("a", "Side A", pool), tradeSide("b", "Side B", pool));
  v.append(wrap);

  const a = S.trade.a.reduce((s,x) => s + x.v, 0), b = S.trade.b.reduce((s,x) => s + x.v, 0);
  const card = el("div", "card verdict");
  card.append(el("h2", null, "Verdict"));
  if (!a && !b) card.append(el("div", "empty", "Add players or picks to both sides to compare."));
  else {
    // One note PER ASSET, not per bucket — edge and luck can legitimately point
    // opposite ways on the same player (underpriced for his production, but
    // that production was itself touchdown-lucky), and splitting them into
    // separate buy/sell tallies made the same name appear on both lists in the
    // same breath, which reads as a bug rather than the nuance it actually is.
    const sideRead = (side, label) => {
      const lines = [];
      for (const x of S.trade[side]) {
        const s = assetSignals(x.id);
        if (!s) continue;
        const bits = [];
        if (["diamond","buy","rental"].includes(s.t.cls)) bits.push("underpriced for his production");
        else if (s.t.cls === "sell") bits.push("overpriced for his production");
        if (s.l?.cls === "sell") bits.push("touchdown-lucky last season");
        else if (s.l?.cls === "buy") bits.push("touchdown-unlucky last season");
        if (s.ms && s.ms.dir !== "agree")
          bits.push(`priced ${s.ms.dir === "dear-here" ? "above" : "below"} the consensus market (${s.ms.txt})`);
        if (s.ph) bits.push("fits the post-hype pattern — real capital, still young, forgotten by the market");
        if (bits.length) lines.push(`${x.name}: ${bits.join("; ")}`);
      }
      if (!lines.length) return null;
      const d = el("div", "sig-note");
      d.append(el("b", null, esc(label) + " "));
      lines.forEach((l, i) => { if (i) d.append(el("br")); d.append(document.createTextNode(l)); });
      return d;
    };
    const rA = sideRead("a", "Side A"), rB = sideRead("b", "Side B");
    if (rA || rB) {
      const box = el("div", "sig-notes");
      if (rA) box.append(rA); if (rB) box.append(rB);
      card.append(box);
    }
    const total = a + b || 1;
    const bar = el("div", "vbar");
    const ad = el("div", "a"), bd = el("div", "b");
    ad.style.width = (a/total*100) + "%"; bd.style.width = (b/total*100) + "%";
    bar.append(ad, bd); card.append(bar);
    card.append(el("div", "vlabels",
      `<span><span class="swatch" style="background:var(--s1)"></span> Side A · ${fmt(a)}</span>
       <span>Side B · ${fmt(b)} <span class="swatch" style="background:var(--s2)"></span></span>`));
    const diff = Math.abs(a-b), pct = diff / Math.max(a,b) * 100;
    const lead = a > b ? "Side A" : "Side B";
    const msg = pct < 5 ? "Dead even — fair trade" :
      pct < 12 ? `${lead} wins slightly` : `${lead} wins clearly`;
    card.append(el("div", "vmsg",
      `${esc(msg)}<span class="sub">difference ${fmt(diff)} (${pct.toFixed(1)}%)` +
      (diff > 0 ? ` — ${a<b ? "Side A" : "Side B"} needs ~${fmt(diff)} more value to even it` : "") +
      `</span>`));
  }
  v.append(card);
}
function tradeSide(side, label, pool) {
  const box = el("div", "tside");
  box.append(el("h3", null,
    `<span class="swatch" style="background:var(${side === "a" ? "--s1" : "--s2"})"></span>${label}`));
  const search = el("div", "tsearch");
  const inp = el("input"); inp.placeholder = "Search players or picks…";
  const sugg = el("div", "sugg hidden");
  inp.addEventListener("input", () => {
    const q = inp.value.trim().toLowerCase();
    sugg.innerHTML = ""; sugg.classList.toggle("hidden", q.length < 2);
    if (q.length < 2) return;
    const taken = new Set([...S.trade.a, ...S.trade.b].map(x => x.id));
    pool.filter(p => !taken.has(p.id) && p.name.toLowerCase().includes(q)).slice(0, 8)
      .forEach(p => {
        const b = el("button", null,
          `<span class="posbadge">${esc(p.pos)}</span> ${esc(p.name)}` +
          (p.owner ? ` <span style="color:var(--ink-muted);font-size:11px">· ${esc(p.owner)}</span>` : "") +
          `<span class="sv">${fmt(p.v)}</span>`);
        b.addEventListener("click", () => { S.trade[side].push(p); render(); });
        sugg.append(b);
      });
    if (!sugg.children.length) sugg.append(el("div", "empty", "No match"));
  });
  search.append(inp, sugg); box.append(search);
  S.trade[side].forEach((p, i) => {
    const a = el("div", "asset",
      `<span class="posbadge">${esc(p.pos)}</span> ${esc(p.name)}
       <span class="av">${fmt(p.v)}</span>`);
    const rm = el("button", "rm", "✕");
    rm.addEventListener("click", () => { S.trade[side].splice(i, 1); render(); });
    a.append(rm); box.append(a);
    const chips = sigChips(p.id);
    if (chips) {
      const html = fullRead(p.id);
      chips.addEventListener("mousemove", ev => showTT(html, ev));
      chips.addEventListener("mouseleave", hideTT);
      chips.addEventListener("click", ev => { showTT(html, ev); ev.stopPropagation(); });
      box.append(chips);
    }
  });
  const sum = S.trade[side].reduce((s,x) => s + x.v, 0);
  box.append(el("div", "total", sum ? fmt(sum) : ""));
  return box;
}

/* What has actually been tested, stated plainly. Every signal here was replayed
   against two independent one-year windows of DynastyProcess price history,
   each call compared against players of similar starting value. One of the
   three came back inconsistent, and saying so is the point: a tool that only
   advertises its wins is not an analytics tool, it is a sales pitch. */
function evidenceNote() {
  const ev = S.sigMeta?.evidence;
  const box = el("div", "evidence");
  if (!ev) { box.append(el("div", "sub", "No backtest recorded in this data file.")); return box; }
  box.append(el("div", "ev-h", "What has been measured — and what has not"));
  const LABEL = { held:["buy","HELD UP"], failed:["sell","DID NOT"], modest:["hold","MODEST"],
                  unproven:["nosample","UNPROVEN"], suggestive:["hold","SUGGESTIVE"] };
  const row = (state, txt) => {
    const [cls, txt2] = LABEL[state] || LABEL.modest;
    const d = el("div", "ev-row");
    d.append(el("span", `tag ${cls}`, txt2), el("span", null, esc(txt)));
    box.append(d);
  };
  if (ev.edgeBuy) row(ev.edgeBuy.verdict === "unproven" ? "unproven" : "held", ev.edgeBuy.claim);
  if (ev.tdLuckOnPoints) row("held", ev.tdLuckOnPoints.claim);
  if (ev.tdLuckOnValue) row("failed", ev.tdLuckOnValue.claim +
    " So use it to judge what a player will SCORE next season, not what the market will pay for him.");
  if (ev.projection) row("modest", ev.projection.claim);
  if (ev.marketShape) row("suggestive", ev.marketShape.claim);
  if (ev.ageArb) row("suggestive", ev.ageArb.claim);
  // Composed from the risk file itself so the words can never drift from the data.
  const a = S.riskMeta?.arch;
  if (a?.RB_elite && a?.WR_elite) row("held",
    `Measured on ${S.riskMeta.snapshots} weekly value snapshots since 2019: elite RBs run ` +
    `${(a.RB_elite.vol_med / a.WR_elite.vol_med).toFixed(1)}× the week-to-week turbulence of elite WRs, ` +
    `with worse peak-to-trough slides (${(a.RB_elite.mdd_med*100).toFixed(0)}% vs ${(a.WR_elite.mdd_med*100).toFixed(0)}%), ` +
    `and the same ordering holds one tier down. Only ${a.RB_elite.n} elite RBs exist, so the direction is solid and the magnitudes are soft. ` +
    `Even elite WRs median a ${(a.WR_elite.mdd_med*100).toFixed(0)}% slide inside two years — nothing in dynasty is actually safe.`);
  return box;
}

/* ---------- draft war room ---------- */
/* Value over replacement, against THIS league's exact lineup. Replacement
   level is what makes an 11-team 1QB league price players differently from
   the 12-team superflex the big sites assume: the last startable QB here is
   QB11, and everything above him is worth only what it clears that bar by.
   Flex slots are split half RB / half WR — tight ends rarely win a flex spot
   in practice; the assumption is stated here so it can be argued with. */
function replacementLevels() {
  const teams = S.league?.total_rosters || 11;
  const slots = (S.league?.roster_positions || []).filter(s => !["BN","IR","TAXI"].includes(s));
  const count = { QB:0, RB:0, WR:0, TE:0 };
  for (const s of slots) {
    if (count[s] !== undefined) count[s]++;
    else if (POS_SLOTS[s]) {
      if (s === "SUPER_FLEX") count.QB += 0.7, count.RB += 0.15, count.WR += 0.15;
      else count.RB += 0.5, count.WR += 0.5;
    }
  }
  const proj = {};
  for (const [id, sg] of Object.entries(S.sig || {}))
    if (sg.proj != null && GROUPS.includes(sg.pos)) (proj[sg.pos] ||= []).push(sg.proj);
  const out = {};
  for (const g of GROUPS) {
    const n = Math.max(1, Math.round(teams * count[g]));
    const arr = (proj[g] || []).sort((a,b) => b - a);
    out[g] = { rank: n, ppg: arr[Math.min(n, arr.length) - 1] ?? 0 };
  }
  return out;
}

async function fetchDraftState() {
  if (!S.league?.draft_id) { S.draftPicks = null; S.draftStatus = null; return; }
  try {
    const [draft, picks] = await Promise.all([
      sleeper(`/draft/${S.league.draft_id}`),
      sleeper(`/draft/${S.league.draft_id}/picks`)]);
    S.draftStatus = draft?.status || null;
    S.draftPicks = new Map((picks || []).map(p => [String(p.player_id),
      { by: p.picked_by, round: p.round, no: p.pick_no }]));
  } catch { S.draftPicks = null; S.draftStatus = null; }
}

function renderDraft(v) {
  v.append(el("div", "status", '<span class="spin"></span>Loading draft state…'));
  fetchDraftState().then(() => { if (S.tab === "draft") renderDraftInner(v); });
  // A live draft moves; poll while the tab is open, stop the moment it isn't.
  clearInterval(S.draftTimer);
  if (S.draftStatus !== "complete")
    S.draftTimer = setInterval(async () => {
      if (S.tab !== "draft") { clearInterval(S.draftTimer); return; }
      const before = S.draftPicks?.size || 0;
      await fetchDraftState();
      if ((S.draftPicks?.size || 0) !== before) render();
    }, 15000);
}

function renderDraftInner(v) {
  v.innerHTML = "";
  const repl = replacementLevels();
  const taken = S.draftPicks || new Map();
  const userByRid = new Map(S.lusers.map(u => [u.user_id, u.display_name]));

  const rows = [];
  for (const [id, sg] of Object.entries(S.sig || {})) {
    if (!GROUPS.includes(sg.pos)) continue;
    if (S.faPos !== "ALL" && sg.pos !== S.faPos) continue;
    const proj = sg.proj;
    const vor = proj != null ? proj - repl[sg.pos].ppg : null;
    const pk = taken.get(id);
    if (proj == null && !val(id) && !sg.rookie) continue;
    rows.push({ id, pos: sg.pos, proj, vor, pk,
      name: S.values[id]?.name || pinfo(id).n, v: val(id) });
  }
  rows.sort((a,b) => (b.vor ?? -99) - (a.vor ?? -99) || b.v - a.v);

  const avail = rows.filter(r => !r.pk);
  const startable = {};
  for (const g of GROUPS) startable[g] = avail.filter(r => r.pos === g && (r.vor ?? -1) > 0).length;

  const bar = el("div", "controls");
  ["ALL", ...GROUPS].forEach(g => {
    const c = el("button", "chip" + (S.faPos === g ? " on" : ""), g);
    c.addEventListener("click", () => { S.faPos = g; render(); });
    bar.append(c);
  });
  bar.append(el("span", "head-spacer"),
    el("span", "pill", S.draftStatus ? `draft: ${S.draftStatus.replace("_"," ")}` : "no draft found"),
    el("span", "pill", `${taken.size} picks made`));
  v.append(bar);

  const stats = el("div", "statrow");
  stats.append(
    statTile("Startable left", GROUPS.map(g => `${g} ${startable[g]}`).join(" · "),
      "players projected above replacement, still on the board"),
    statTile("Replacement level", GROUPS.map(g => `${g}${repl[g].rank}`).join(" · "),
      `for this league's exact lineup (${S.league?.total_rosters} teams)`),
    statTile("Picks tracked", taken.size ? "live" : "none yet",
      taken.size ? "board updates every 15s during the draft" : "board shows the full pool"));
  v.append(stats);

  const card = el("div", "card");
  card.append(el("h2", null, "Draft board — value over replacement"),
    el("div", "sub", "VOR = projected points per game above the last startable player at his position in THIS " +
      "league. Flex counted half RB, half WR. Filter to one position to see its tier lines — each marks a " +
      "full-point drop, the moment to stop waiting. Projections carry ±3.3 ppg of honest error; the tags are the tiebreakers."));
  card.append(evidenceNote());

  const tbl = el("table");
  tbl.innerHTML = `<thead><tr><th>#</th><th>Player</th><th class="num">Age</th>
    <th class="num">Proj</th><th class="num">VOR</th><th class="num">Value</th>
    <th>Age tax</th><th>Reads</th><th>Status</th></tr></thead>`;
  const tb = el("tbody");
  const shown = rows.slice(0, 140);
  let lastVor = null, rank = 0;
  for (const r of shown) {
    rank++;
    // Tier breaks only when a single position is filtered: on the ALL view
    // positions interleave, so a gap between consecutive rows says nothing
    // about any position's actual cliff.
    if (S.faPos !== "ALL" && lastVor != null && r.vor != null && lastVor - r.vor >= 1.0)
      tb.append(el("tr", null, `<td class="gh" colspan="9">— tier break: ${(lastVor - r.vor).toFixed(1)} ppg drop —</td>`));
    if (r.vor != null) lastVor = r.vor;
    const at = ageTax(r.id), tag = edgeTag(r.id), sc = successionRead(r.id);
    const readBits = [];
    if (!["hold","nosample"].includes(tag.cls)) readBits.push(`<span class="tag ${tag.cls}">${esc(tag.txt)}</span>`);
    if (sc) readBits.push('<span class="tag diamond">DEV</span>');
    if (postHype(r.id)) readBits.push('<span class="tag diamond">PH</span>');
    const row = el("tr", r.pk ? "taken" : null,
      `<td class="num">${rank}</td>
       <td>${esc(r.name)} <span class="posbadge">${esc(r.pos)}</span></td>
       <td class="num">${pinfo(r.id).a ?? "—"}</td>
       <td class="num">${r.proj != null ? r.proj.toFixed(1) : "—"}</td>
       <td class="num">${r.vor != null ? `<b class="${r.vor > 0 ? "edge-pos" : ""}">${r.vor > 0 ? "+" : ""}${r.vor.toFixed(1)}</b>` : "—"}</td>
       <td class="num">${r.v ? fmt(r.v) : "—"}</td>
       <td>${at ? `<span class="tag ${at.cls}">${esc(at.txt)}</span>` : ""}</td>
       <td>${readBits.join(" ")}</td>
       <td>${r.pk ? `<span class="tag sell">R${r.pk.round} · ${esc(userByRid.get(r.pk.by) || "taken")}</span>`
                  : '<span style="color:var(--ink-muted)">available</span>'}</td>`);
    const html = fullRead(r.id);
    row.addEventListener("mousemove", ev => showTT(html, ev));
    row.addEventListener("mouseleave", hideTT);
    row.addEventListener("click", ev => { showTT(html, ev); ev.stopPropagation(); });
    tb.append(row);
  }
  tbl.append(tb); card.append(tbl);
  card.append(el("div", "sub",
    `Showing ${shown.length} of ${rows.length}. Players with no projection (rookies, injuries) sort by market value — ` +
    `their draft-capital and development reads are in the hover, which is where late-round picks live.`));
  v.append(card);
}

/* ---------- trade finder ---------- */
function pkgLine(ids) { return ids.map(x => `${x.pos} ${S.values[x.id]?.name || pinfo(x.id).n}`).join(" + "); }
function renderTradeFinder(v) {
  if (!S.myRosterId) {
    v.append(el("div", "card"), el("div", "empty", "Couldn't find your roster in this league."));
    return;
  }
  const anyRostered = S.rosters.some(r => (r.players || []).length > 0);
  if (!anyRostered) {
    const card = el("div", "card");
    card.append(el("h2", null, "Trade Finder"),
      el("div", "empty",
        "Every roster in this league is empty — nobody has drafted yet. " +
        "Trade Finder needs real rosters to compare needs against; it has nothing to work with until then. " +
        "The engine itself is live and already checked every other team in this league — there's just nobody on them."));
    v.append(card); return;
  }
  const { ideas, myArch, teams } = generateTradeIdeas();
  const stats = el("div", "statrow");
  stats.append(
    statTile("Your team", myArch ? myArch.cls.toUpperCase() : "—", myArch?.why || ""),
    statTile("Trade ideas found", fmt(ideas.length), `across ${teams.length - 1} other rosters`),
    statTile("Best fit", ideas[0] ? (ideas[0].fair*100).toFixed(0)+"% value match" : "—",
      ideas[0] ? `vs ${ideas[0].oppName}` : ""));
  v.append(stats);

  const card = el("div", "card");
  card.append(el("h2", null, "Trade Finder"),
    el("div", "sub", "Checked every other roster in the league for a fit: value that clears within 28%, " +
      "matched where possible to a hole on your roster and a hole on theirs. Ranked by fairness first — " +
      "edge and need only break ties, because an unfair trade nobody accepts is not a trade."));
  card.append(evidenceNote());
  if (!ideas.length) {
    card.append(el("div", "empty",
      "No package cleared the fairness bar against any opponent right now. That will change as rosters fill in and prices move."));
    v.append(card); return;
  }
  for (const idea of ideas.slice(0, 10)) {
    const box = el("div", "trade-idea");
    const hdr = el("div", "ti-hdr");
    hdr.append(el("span", "ti-vs", `vs ${esc(idea.oppName)}`),
      idea.oppArch ? el("span", `tag ${idea.oppArch.cls === "contender" ? "buy" : idea.oppArch.cls === "rebuilder" ? "sell" : "hold"}`,
        idea.oppArch.cls.toUpperCase()) : null,
      el("span", "ti-fair", `${(idea.fair*100).toFixed(0)}% value match`));
    box.append(hdr);
    const body = el("div", "ti-body");
    body.append(
      el("div", "ti-side", `<b>You send</b> ${esc(pkgLine(idea.give))} <span class="ti-val">${fmt(idea.gv)}</span>`),
      el("div", "ti-arrow", "⇄"),
      el("div", "ti-side", `<b>You get</b> ${esc(pkgLine(idea.get))} <span class="ti-val">${fmt(idea.tv)}</span>`));
    box.append(body);
    const why = el("div", "ti-why");
    const winBits = [];
    if (idea.needFit) winBits.push("fills a real hole on both sides, not just moving value around");
    if (idea.edgeGain > 300) winBits.push(`you gain ${fmt(idea.edgeGain)} in Edge — the pieces coming back are underpriced for what they produce`);
    else if (idea.edgeGain < -300) winBits.push(`costs you ${fmt(Math.abs(idea.edgeGain))} in Edge — you're paying a premium for fit, worth knowing`);
    why.append(el("div", null, `<b>Why it's fair:</b> ${esc(winBits.length ? winBits.join("; ") : "value lines up closely on both sides")}.`));
    if (idea.oppArch) why.append(el("div", null,
      `<b>Why they might say yes:</b> ${esc(idea.oppName)} reads as a ${idea.oppArch.cls} (${idea.oppArch.why}) — ` +
      `${idea.oppArch.cls === "contender" ? "win-now teams pay for immediate starters." :
        idea.oppArch.cls === "rebuilder" ? "rebuilding teams want the pieces you're sending, not the ones you're asking for." :
        "not clearly buying or selling, so fit matters more than saying no."}`));
    box.append(why);
    const html = idea.get.concat(idea.give).map(x => fullRead(x.id)).join("<hr style='border-color:var(--grid);margin:8px 0'>");
    box.addEventListener("mousemove", ev => showTT(html, ev));
    box.addEventListener("mouseleave", hideTT);
    box.addEventListener("click", ev => { showTT(html, ev); ev.stopPropagation(); });
    card.append(box);
  }
  card.append(el("div", "sub", "Hover or tap a card for the full reasoning on every player in the deal."));
  v.append(card);
}

/* ---------- development candidates ---------- */
/* The one board that needs no fantasy roster at all — it reads NFL depth
   charts, not fantasy ones, so it works before either league has drafted a
   single pick. That's deliberate: this is the signal available right now. */
function renderDevBoard(v, owner) {
  const rows = [];
  for (const id of Object.keys(S.sig || {})) {
    if (S.boardPos !== "ALL" && S.sig[id].pos !== S.boardPos) continue;
    const sc = successionRead(id);
    if (!sc) continue;
    rows.push({ id, sc, own: owner.get(id), name: S.values[id]?.name || pinfo(id).n });
  }
  // Youngest-behind-oldest first — the widest gap is the clearest bet.
  rows.sort((a,b) => (b.sc.incAge - b.sc.myAge) - (a.sc.incAge - a.sc.myAge));

  const stats = el("div", "statrow");
  stats.append(
    statTile("Development candidates", fmt(rows.length), "young, behind a fading starter, still cheap"),
    statTile("Depth charts as of", S.sigMeta?.built ? esc(S.sigMeta.built) : "—", "ESPN via nflverse, refreshed ~daily"),
    statTile("Needs a fantasy roster?", "No", "this reads NFL depth charts, not your league"));
  v.append(stats);

  const card = el("div", "card");
  card.append(el("h2", null, "Development candidates"),
    el("div", "sub", "Dynasty value is partly a bet on a role a player doesn't have yet. These are young " +
      "players stuck behind a starter on the back half of his own age curve — the market can't price a role " +
      "change that hasn't happened, so it's priced like it never will."));
  if (!rows.length) { card.append(el("div", "empty", "No development candidates clear the bar with this filter.")); v.append(card); return; }

  const tbl = el("table");
  tbl.innerHTML = `<thead><tr><th>Player</th><th>Held by</th><th class="num">Age</th>
    <th>Behind</th><th class="num">Incumbent age</th><th class="num">Value</th>
    <th class="num">Draft capital</th></tr></thead>`;
  const tb = el("tbody");
  for (const r of rows.slice(0, 30)) {
    const d = draftRead(r.id);
    const row = el("tr", r.own?.mine ? "me" : null,
      `<td>${esc(r.name)} <span class="posbadge">${esc(S.sig[r.id].pos)}</span></td>
       <td>${r.own ? esc(r.own.name) + (r.own.mine ? " (you)" : "") : '<span style="color:var(--ink-muted)">free agent</span>'}</td>
       <td class="num">${r.sc.myAge}</td>
       <td>${esc(r.sc.incName)}</td>
       <td class="num">${r.sc.incAge}</td>
       <td class="num">${fmt(val(r.id))}</td>
       <td class="num">${d ? esc(d.txt) : '<span style="color:var(--ink-muted)">—</span>'}</td>`);
    const html = fullRead(r.id);
    row.addEventListener("mousemove", ev => showTT(html, ev));
    row.addEventListener("mouseleave", hideTT);
    row.addEventListener("click", ev => { showTT(html, ev); ev.stopPropagation(); });
    tb.append(row);
  }
  tbl.append(tb); card.append(tbl);
  card.append(el("div", "sub", `Showing ${Math.min(30, rows.length)} of ${rows.length} · hover or tap a row for the full reasoning.`));
  v.append(card);
}

/* ---------- buy-low / sell-high board ---------- */
function renderBoard(v) {
  const owner = new Map();
  for (const r of S.rosters) for (const id of (r.players || []))
    if (id && id !== "0") owner.set(id, { name: teamName(r.roster_id), mine: r.roster_id === S.myRosterId });

  const bar = el("div", "controls");
  const seg = el("span", "seg");
  [["buy","Buy low"], ["sell","Sell high"], ["dev","Development"]].forEach(([k, lab]) => {
    const b = el("button", S.boardSide === k ? "on" : null, lab);
    b.addEventListener("click", () => { S.boardSide = k; render(); });
    seg.append(b);
  });
  bar.append(seg, el("span", "head-spacer"));
  ["ALL", ...GROUPS].forEach(g => {
    const c = el("button", "chip" + (S.boardPos === g ? " on" : ""), g);
    c.addEventListener("click", () => { S.boardPos = g; render(); });
    bar.append(c);
  });
  v.append(bar);

  if (S.boardSide === "dev") { renderDevBoard(v, owner); return; }

  const buying = S.boardSide === "buy";
  const rows = [];
  for (const id of Object.keys(S.edges)) {
    const e = S.edges[id];
    if (S.boardPos !== "ALL" && e.pos !== S.boardPos) continue;
    const sc = boardScore(id);
    if (sc == null) continue;
    const o = opportunity(id), l = luckRead(id), own = owner.get(id);
    if (buying) {
      // Worth chasing only if the usage is real and the price has not caught up.
      if (!["elite","strong"].includes(o.tier)) continue;
      if (e.tdLuck >= 2) continue;                   // his scoring is inflated too
      if (e.tdLuck > -0.5 && e.edge < 500) continue;
      if (own?.mine) continue;                       // already yours
    } else {
      // Selling high needs an actual high. A player who was touchdown-UNLUCKY has
      // no inflated price to cash in — listing him here is advice to sell a trough.
      if (e.tdLuck < 1) continue;
      if (e.edge > -500 && e.tdLuck < 4) continue;   // priced fairly and only mildly lucky
      if (val(id) < 1000) continue;                  // not worth marketing
    }
    rows.push({ id, e, o, l, own, sc, name: S.values[id]?.name || pinfo(id).n });
  }
  rows.sort((a,b) => buying ? b.sc - a.sc : a.sc - b.sc);
  const top = rows.slice(0, 24);

  const meta = S.sigMeta;
  const stats = el("div", "statrow");
  stats.append(
    statTile(buying ? "Buy-low candidates" : "Sell-high candidates", fmt(rows.length),
      buying ? "real usage, unlucky, underpriced" : "luck-inflated or overpriced"),
    statTile("On other rosters", fmt(top.filter(r => r.own && !r.own.mine).length),
      "trade targets, not waiver adds"),
    statTile("Usage data", meta ? esc(meta.latest) + " season" : "unavailable",
      meta ? "nflverse snapshot · " + esc(meta.built) : "baked file not found"));
  v.append(stats);

  const card = el("div", "card");
  card.append(el("h2", null, buying ? "Buy low" : "Sell high"),
    el("div", "sub", buying
      ? "Players whose usage says they are good, whose touchdown luck says last season lied, and whose price has not caught up."
      : "Players whose scoring outran their usage. Those touchdowns are the least likely part of last season to repeat."));
  card.append(evidenceNote());
  if (!top.length) { card.append(el("div", "empty", "Nothing clears the bar with this filter.")); v.append(card); return; }

  const tbl = el("table");
  tbl.innerHTML = `<thead><tr><th>Player</th><th>Held by</th><th class="num">Age</th>
    <th class="num">Usage</th><th>Tier</th><th class="num">Trend</th><th class="num">Pts/gm</th>
    <th class="num">Adj</th><th class="num">Proj</th><th class="num">Luck</th>
    <th class="num">Value</th><th class="num">Mkt gap</th><th class="num">Edge</th>
    <th>Age curve</th></tr></thead>`;
  const tb = el("tbody");
  for (const r of top) {
    const p = pinfo(r.id);
    const tierCls = { elite:"diamond", strong:"buy", rotational:"hold", thin:"nosample" }[r.o.tier];
    const row = el("tr", r.own?.mine ? "me" : null,
      `<td>${esc(r.name)} <span class="posbadge">${esc(r.e.pos)}</span></td>
       <td>${r.own ? esc(r.own.name) + (r.own.mine ? " (you)" : "") : '<span style="color:var(--ink-muted)">free agent</span>'}</td>
       <td class="num">${p.a ?? "—"}</td>
       <td class="num">${esc(r.o.txt)} <span style="color:var(--ink-muted);font-size:11px">${esc(r.o.lab)}</span></td>
       <td><span class="tag ${tierCls}">${esc(r.o.tier.toUpperCase())}</span></td>
       <td class="num">${(() => { const t = usageTrend(r.id); return t
          ? `<span class="${t.dir === "up" ? "edge-pos" : t.dir === "down" ? "edge-neg" : ""}">${esc(t.txt)}</span>`
          : '<span style="color:var(--ink-muted)">—</span>'; })()}</td>
       <td class="num">${r.e.rawPpg ? r.e.rawPpg.toFixed(1) : "—"}</td>
       <td class="num">${r.e.ppg ? r.e.ppg.toFixed(1) : "—"}</td>
       <td class="num">${(() => { const pj = projection(r.id); return pj
          ? `<b>${pj.ppg.toFixed(1)}</b>` : '<span style="color:var(--ink-muted)">—</span>'; })()}</td>
       <td class="num"><span class="${r.l.cls === "buy" ? "edge-pos" : r.l.cls === "sell" ? "edge-neg" : ""}">${esc(r.l.txt)}</span></td>
       <td class="num">${fmt(val(r.id))}</td>
       <td class="num">${(() => { const ms = marketSplit(r.id); return ms && ms.dir !== "agree"
          ? `<span class="${ms.gap > 0 ? "edge-pos" : "edge-neg"}">${esc(ms.txt)}</span>`
          : '<span style="color:var(--ink-muted)">·</span>'; })()}</td>
       <td class="num">${edgeCell(r.id)}</td>
       <td>${(() => { const a = ageRead(r.id); return a ? `<span class="tag ${a.cls}">${esc(a.txt)}</span>` : ""; })()}</td>`);
    const html = fullRead(r.id, r.own && !r.own.mine
      ? [`Held by ${r.own.name} — this is a trade, not a waiver add.`] : []);
    row.addEventListener("mousemove", ev => showTT(html, ev));
    row.addEventListener("mouseleave", hideTT);
    row.addEventListener("click", ev => { showTT(html, ev); ev.stopPropagation(); });
    tb.append(row);
  }
  tbl.append(tb); card.append(tbl);
  card.append(el("div", "sub",
    `Pts/gm is what he scored; Adj is the same season with lucky and unlucky touchdowns taken back out. ` +
    `Hover or tap any row for the full reasoning. Usage from ${meta ? esc(meta.latest) : "—"}; ` +
    `this is a snapshot, not a live feed.`));
  v.append(card);
}

/* ---------- free agents ---------- */
function renderFreeAgents(v) {
  const rostered = new Set();
  for (const r of S.rosters) for (const id of (r.players || [])) if (id && id !== "0") rostered.add(id);

  const pool = [];
  for (const [id, e] of Object.entries(S.values)) {
    if (rostered.has(id)) continue;
    const p = pinfo(id), pos = e.pos || p.p;
    if (!GROUPS.includes(pos)) continue;
    pool.push({ id, name: e.name || p.n, pos, team: p.t, age: p.a,
      v: e.v, tr: e.tr || 0, ed: S.edges[id] || null });
  }

  const bar = el("div", "controls");
  ["ALL", ...GROUPS].forEach(g => {
    const c = el("button", "chip" + (S.faPos === g ? " on" : ""), g);
    c.addEventListener("click", () => { S.faPos = g; render(); });
    bar.append(c);
  });
  bar.append(el("span", "head-spacer"));
  const seg = el("span", "seg");
  [["edge","Best edge"], ["value","Value"], ["ppg","Points/gm"], ["trend","Trending"]].forEach(([k, lab]) => {
    const b = el("button", S.faSort === k ? "on" : null, lab);
    b.addEventListener("click", () => { S.faSort = k; render(); });
    seg.append(b);
  });
  bar.append(seg);
  v.append(bar);

  const shown = pool.filter(p => S.faPos === "ALL" || p.pos === S.faPos);
  const sorters = {
    edge:  (a,b) => (b.ed?.edge ?? -1e9) - (a.ed?.edge ?? -1e9),
    value: (a,b) => b.v - a.v,
    ppg:   (a,b) => (b.ed?.ppg || 0) - (a.ed?.ppg || 0),
    trend: (a,b) => b.tr - a.tr,
  };
  shown.sort(sorters[S.faSort] || sorters.edge);
  const rows = shown.slice(0, 60);

  const gems = shown.filter(p => ["diamond","buy"].includes(edgeTag(p.id).cls)).length;
  const stats = el("div", "statrow");
  stats.append(
    statTile("Free agents graded", fmt(shown.filter(p => p.ed?.edge != null).length),
      `${fmt(shown.length)} total available`),
    statTile("Underpriced on the wire", fmt(gems), "produce above their market price"),
    statTile("Production baseline", esc(S.prodSeason || "—"),
      `${MIN_GP}+ games to be ranked`));
  v.append(stats);

  const card = el("div", "card");
  card.append(el("h2", null, "Free agents by edge"),
    el("div", "sub", "Edge compares a player only against others at his position " +
      (S.mode === "dynasty" ? "and in his age group" : "") +
      ": what the market charges for his level of production, minus what it charges for him. " +
      "Positive means he outscores his price. Thin samples are damped toward zero."));
  if (!rows.length) { card.append(el("div", "empty", "No free agents match that filter.")); v.append(card); return; }

  const tbl = el("table");
  tbl.innerHTML = `<thead><tr><th>Player</th><th>Team</th><th class="num">Age</th>
    <th class="num">Pts/gm</th><th class="num">Gm</th><th class="num">Produces</th>
    <th class="num">Priced</th><th class="num">Trend</th><th class="num">Proj</th>
    <th class="num">Value</th><th class="num">Mkt gap</th><th class="num">Edge</th>
    <th class="num">30d</th><th>Read</th></tr></thead>`;
  const tb = el("tbody");
  for (const p of rows) {
    const e = p.ed, tag = edgeTag(p.id);
    const trTxt = !p.tr ? '<span style="color:var(--ink-muted)">·</span>'
      : `<span class="${p.tr > 0 ? "delta-up" : "delta-down"}">${p.tr > 0 ? "▲" : "▼"} ${fmt(Math.abs(p.tr))}</span>`;
    const tr = el("tr", null,
      `<td>${esc(p.name)} <span class="posbadge">${esc(p.pos)}</span></td>
       <td>${esc(p.team || "FA")}</td>
       <td class="num">${p.age ?? "—"}</td>
       <td class="num">${e?.ppg ? e.ppg.toFixed(1) : "—"}</td>
       <td class="num">${e?.gp || "—"}</td>
       <td class="num">${e?.prodRank ? esc(p.pos + e.prodRank) : "—"}</td>
       <td class="num">${e?.priceRank ? esc(p.pos + e.priceRank) : "—"}</td>
       <td class="num">${(() => { const t = usageTrend(p.id); return t
          ? `<span class="${t.dir === "up" ? "edge-pos" : t.dir === "down" ? "edge-neg" : ""}">${esc(t.txt)}</span>`
          : '<span style="color:var(--ink-muted)">—</span>'; })()}</td>
       <td class="num">${(() => { const pj = projection(p.id); return pj
          ? `<b>${pj.ppg.toFixed(1)}</b>` : '<span style="color:var(--ink-muted)">—</span>'; })()}</td>
       <td class="num">${fmt(p.v)}</td>
       <td class="num">${(() => { const ms = marketSplit(p.id); return ms && ms.dir !== "agree"
          ? `<span class="${ms.gap < 0 ? "edge-pos" : "edge-neg"}">${esc(ms.txt)}</span>`
          : '<span style="color:var(--ink-muted)">·</span>'; })()}</td>
       <td class="num">${edgeCell(p.id)}</td>
       <td class="num">${trTxt}</td>
       <td><span class="tag ${tag.cls}">${esc(tag.txt)}</span>${postHype(p.id) ? ' <span class="tag diamond">POST-HYPE</span>' : ""}</td>`);
    const html = fullRead(p.id);
    tr.addEventListener("mousemove", ev => showTT(html, ev));
    tr.addEventListener("mouseleave", hideTT);
    tr.addEventListener("click", ev => { showTT(html, ev); ev.stopPropagation(); });
    tb.append(tr);
  }
  tbl.append(tb); card.append(tbl);
  card.append(el("div", "sub", `Showing ${rows.length} of ${fmt(shown.length)} · ` +
    `production from the ${esc(S.prodSeason || "—")} season · hover or tap a row for the reasoning`));
  v.append(card);
}

/* ---------- standings ---------- */
function renderStandings(v) {
  const card = el("div", "card");
  card.append(el("h2", null, "Standings"),
    el("div", "sub", `${esc(S.league.name)} · ${esc(S.season)} season`));
  const pts = (s, pre) => (s?.[pre] || 0) + (s?.[pre + "_decimal"] || 0) / 100;
  const rows = [...S.rosters].sort((x,y) =>
    (y.settings?.wins||0) - (x.settings?.wins||0) || pts(y.settings,"fpts") - pts(x.settings,"fpts"));
  const anyGames = rows.some(r => (r.settings?.wins||0) + (r.settings?.losses||0) > 0);
  if (!anyGames) { card.append(el("div", "empty",
    "No games played yet this season — standings appear after week 1.")); v.append(card); return; }
  const tbl = el("table");
  tbl.innerHTML = `<thead><tr><th>#</th><th>Team</th><th class="num">W</th>
    <th class="num">L</th><th class="num">PF</th><th class="num">PA</th></tr></thead>`;
  const tb = el("tbody");
  rows.forEach((r, i) => {
    const s = r.settings || {};
    tb.append(el("tr", r.roster_id === S.myRosterId ? "me" : null,
      `<td>${i+1}</td><td>${esc(teamName(r.roster_id))}${r.roster_id === S.myRosterId ? ' <span class="you posbadge">YOU</span>' : ""}</td>
       <td class="num">${s.wins||0}</td><td class="num">${s.losses||0}</td>
       <td class="num">${pts(s,"fpts").toFixed(1)}</td><td class="num">${pts(s,"fpts_against").toFixed(1)}</td>`));
  });
  tbl.append(tb); card.append(tbl); v.append(card);
}

/* ---------- market ---------- */
async function renderMarket(v) {
  v.append(el("div", "status", '<span class="spin"></span>Loading market movers…'));
  let adds = [], drops = [];
  try { [adds, drops] = await Promise.all([
    sleeper("/players/nfl/trending/add?lookback_hours=24&limit=12"),
    sleeper("/players/nfl/trending/drop?lookback_hours=24&limit=12")]); } catch {}
  if (S.tab !== "market") return;
  v.innerHTML = "";
  const wrap = el("div", "grid2");
  wrap.append(marketCard("Hottest adds (24h)", adds || [], "add"),
              marketCard("Most dropped (24h)", drops || [], "drop"));
  v.append(wrap);
}
function marketCard(title, rows, kind) {
  const card = el("div", "card");
  card.append(el("h2", null, esc(title)),
    el("div", "sub", "Sleeper waiver activity across all leagues · value = trade value"));
  if (!rows.length) { card.append(el("div", "empty", "Market data unavailable right now.")); return card; }
  const max = Math.max(...rows.map(r => r.count || 0), 1);
  const tbl = el("table");
  tbl.innerHTML = `<thead><tr><th>Player</th><th style="width:40%">${kind === "add" ? "Adds" : "Drops"}</th>
    <th class="num">Count</th><th class="num">Value</th></tr></thead>`;
  const tb = el("tbody");
  for (const r of rows) {
    const p = pinfo(String(r.player_id));
    tb.append(el("tr", null,
      `<td>${esc(p.n)} <span class="posbadge">${esc(p.p)}</span></td>
       <td><span class="meter"><span class="track"><span class="fill" style="width:${(r.count||0)/max*100}%"></span></span></span></td>
       <td class="num">${fmt(r.count || 0)}</td>
       <td class="num">${val(String(r.player_id)) ? fmt(val(String(r.player_id))) : "—"}</td>`));
  }
  tbl.append(tb); card.append(tbl);
  return card;
}

/* =============================== boot / flows =============================== */
async function loadEverything(username) {
  banner("");
  $("#tabs").classList.add("hidden"); $("#controls").classList.add("hidden");
  $("#view").innerHTML = "";
  try {
    setStatus(`Looking up ${username}…`);
    const user = await sleeper(`/user/${encodeURIComponent(username)}`);
    if (!user) { setStatus(null);
      banner(`Sleeper user <b>${esc(username)}</b> not found — check the spelling.`, true); return; }
    S.user = user; S.username = user.username || username;
    const av = $("#uavatar");
    if (user.avatar && !DEMO) { av.src = `${CDN}/avatars/thumbs/${user.avatar}`; av.classList.remove("hidden"); }
    else av.classList.add("hidden");

    setStatus("Finding your leagues…");
    const state = await sleeper("/state/nfl") || {};
    S.seasonType = state.season_type || null;
    let season = String(state.league_season || state.season || new Date().getFullYear());
    let leagues = await sleeper(`/user/${user.user_id}/leagues/nfl/${season}`) || [];
    if (!leagues.length) {
      const prev = String(Number(season) - 1);
      leagues = await sleeper(`/user/${user.user_id}/leagues/nfl/${prev}`) || [];
      if (leagues.length) { season = prev;
        banner(`No ${esc(String(Number(prev)+1))} leagues yet — showing your <b>${esc(prev)}</b> leagues.`); }
    }
    S.season = season; S.leagues = leagues;
    if (!leagues.length) { setStatus(null);
      banner(`<b>${esc(S.username)}</b> has no NFL leagues in ${esc(season)}.`, true); return; }

    const params = new URLSearchParams(location.search);
    const wanted = params.get("league");
    await pickLeague(leagues.find(l => l.league_id === wanted) || leagues[0]);
  } catch (e) {
    setStatus(null);
    banner(`Couldn't reach the Sleeper API (${esc(e.message || e)}). ` +
      `If you opened this file directly, try serving it: <code>python3 -m http.server</code>`, true);
  }
}
async function pickLeague(league) {
  S.league = league; S.trade = { a:[], b:[] }; S.rosterView = null;
  const chips = $("#leagueChips"); chips.innerHTML = "";
  S.leagues.forEach(l => {
    const c = el("button", "chip" + (l.league_id === league.league_id ? " on" : ""), esc(l.name));
    c.addEventListener("click", () => pickLeague(l));
    chips.append(c);
  });
  try {
    setStatus(`Loading ${league.name}…`);
    const [rosters, lusers] = await Promise.all([
      sleeper(`/league/${league.league_id}/rosters`),
      sleeper(`/league/${league.league_id}/users`)]);
    S.rosters = rosters || []; S.lusers = lusers || [];
    const mine = S.rosters.find(r =>
      r.owner_id === S.user.user_id || (r.co_owners || []).includes(S.user.user_id));
    S.myRosterId = mine ? mine.roster_id : null;

    await loadPlayers();
    setStatus("Loading trade values…");
    await loadValues();
    setStatus("Loading production and usage…");
    await loadSignals();
    await loadRisk();
    calibrateMarkets();
    try { await loadStats(); } catch { S.stats = {}; S.prodSeason = null; }
    computeEdges();
    computeDepthIndex();

    const f = leagueFormat();
    $("#fmtPill").textContent =
      `${f.numQbs === 2 ? "Superflex" : "1QB"} · ${f.ppr === 1 ? "PPR" : f.ppr === 0.5 ? "Half PPR" : f.ppr + " PPR"}` +
      (f.tep ? " · TEP" : "") + ` · ${f.teams} tm`;
    // Shareable deep link. Sandboxed hosts can refuse replaceState — not fatal.
    if (!DEMO) try {
      const url = new URL(location); url.searchParams.set("user", S.username);
      url.searchParams.set("league", league.league_id); history.replaceState(null, "", url);
    } catch {}

    setStatus(null);
    $("#controls").classList.remove("hidden");
    $("#tabs").classList.remove("hidden");
    render();
  } catch (e) {
    setStatus(null);
    banner(`Couldn't load that league (${esc(e.message || e)}).`, true);
  }
}

/* ---------- wire up ---------- */
document.addEventListener("click", hideTT);   // tap anywhere to dismiss a pinned tooltip
document.querySelectorAll("nav.tabs button").forEach(b =>
  b.addEventListener("click", () => { S.tab = b.dataset.tab; render(); }));
$("#modeSeg").querySelectorAll("button").forEach(b =>
  b.addEventListener("click", async () => {
    if (S.mode === b.dataset.mode) return;
    S.mode = b.dataset.mode;
    $("#modeSeg").querySelectorAll("button").forEach(x =>
      x.classList.toggle("on", x === b));
    setStatus("Reloading values…"); await loadValues();
    computeEdges();   // the price ladder moved, so every edge moves with it
    setStatus(null); render();
  }));
/* localStorage throws in some sandboxed embeddings — never let it break a click. */
const remember = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const recall = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
$("#loadBtn").addEventListener("click", () => {
  const u = $("#uname").value.trim(); if (u) { remember("wc_user", u); loadEverything(u); }
});
$("#uname").addEventListener("keydown", e => { if (e.key === "Enter") $("#loadBtn").click(); });
$("#themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  remember("wc_theme", next);
});

(function boot() {
  const savedTheme = recall("wc_theme");
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  const qs = new URLSearchParams(location.search);
  const u = DEMO ? DEMO.user.display_name
    : (qs.get("user") || recall("wc_user") || "PaySuk34");
  $("#uname").value = u;
  if (DEMO) { $("#uname").disabled = true; $("#loadBtn").disabled = true;
    $("#uname").title = "Fixed in the preview — the live site loads any username"; }
  loadEverything(u);
})();
</script>
